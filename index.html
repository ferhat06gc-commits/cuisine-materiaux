function basculer(sol){
  if (phase !== 'dedans' || bascEnCours || sol === solutionActive) return;
  bascEnCours = true;
  const de = solutionActive, S1 = DONNEES.solutions[sol];
  const t0v = de ? DONNEES.solutions[de].tempInterieure : DONNEES.exterieur.temp;
  const h0v = de ? DONNEES.solutions[de].humRelative   : DONNEES.exterieur.hum;
  const chaud = (sol !== 'terre');
  solutionActive = sol;
  audioDemarre(); sonCourt(chaud ? 140 : 420, 0.18, 'sine');
  ambiance(chaud);
  tache(1.4, u => {
    const k = lisse(u);
    cadran.userData.sol = sol;
    cadran.userData.t = t0v + (S1.tempInterieure - t0v)*k;
    cadran.userData.h = h0v + (S1.humRelative   - h0v)*k;
    cadran.userData.redraw();
    jourDedans.intensity  = chaud ? (2.6 + 2.2*k) : (4.8 - 2.2*k);
    jourDedans.color.setHSL(chaud ? 0.105 - 0.020*k : 0.085 + 0.020*k, chaud ? 0.30+0.32*k : 0.62-0.32*k, chaud ? 0.66 : 0.80);
    cielDedans.intensity  = chaud ? (0.46 - 0.12*k) : (0.34 + 0.12*k);
    cielDedans.color.setHSL(chaud ? 0.10 : 0.58, chaud ? 0.45 : 0.22, chaud ? 0.62 : 0.80);
    renderer.toneMappingExposure = chaud ? (1.02 + 0.16*k) : (1.18 - 0.16*k);
    brouillardChaud.density = chaud ? 0.085*k : 0.085*(1-k);
    scene.fog = chaud || brouillardChaud.density > 0.002 ? brouillardChaud : null;
    /* l'air qui monte le long du mur : bien plus visible côté conventionnel */
    filetsAir.material.opacity = chaud ? 0.34*k : 0.34*(1-k) + 0.04;
    hygro.userData.h = cadran.userData.h; hygro.userData.redraw();
  }, () => {
    bascEnCours = false;
    if (!chaud){ scene.fog = null; renderer.toneMappingExposure = 1.02; }
    essayes.add(sol);
    const D = DONNEES, T = D.solutions[sol].tempInterieure, E = D.exterieur.temp;
    if (essayes.size >= 2){
      montrerSortie();
      dirFaire('Même soleil, même ventilation, deux ambiances. <b>L’écart est de '
        + D.ecartTemp + ' °C.</b> Rebasculez autant que vous voulez.');
    } else {
      dirFaire(T + ' °C dedans quand il en fait ' + E + ' dehors. <b>Touchez le mur</b>, puis essayez l’autre matériau.');
    }
    majBoutonsDedans();
  });
  chaleurHTML.style.opacity = chaud ? '1' : '0';
}

/* ============================================================================
   ACTE 6 — LA CAMÉRA THERMIQUE
   On ressort, c'est l'hiver. Le visiteur choisit le mur et la consigne de
   chauffage, puis regarde la façade en fausses couleurs.

   Physique : régime permanent, transfert 1D.
       Tse = Te + U · Rse · (Ti − Te)
   Aucun chiffre n'est écrit ici : tout vient de donnees.js, avec sa source,
   et le U du mur de terre est calculé à partir de la recette du visiteur.
   ============================================================================ */
const TH = DONNEES.thermique;

/* --- la palette : une rampe à clarté monotone, du sombre au clair --- */
/* Rampe séquentielle à clarté croissante et régulière (vérifiée en OKLab),
   dans les teintes d'une caméra thermique de terrain : bleu nuit, violet,
   magenta, orange, jaune, crème. */
const RAMPE = ['#10103C','#3A1C74','#6E2A8E','#A33391','#C9457E','#E4663F','#F49A24','#FBCB43','#FFF6DC']
  .map(h => new THREE.Color(h));
function couleurTh(t, min, max){
  const u = Math.max(0, Math.min(1, (t - min) / Math.max(0.001, max - min)));
  const x = u * (RAMPE.length - 1);
  const i = Math.min(RAMPE.length - 2, Math.floor(x));
  return RAMPE[i].clone().lerp(RAMPE[i+1], x - i);
}
function cssTh(t, min, max){ return '#' + couleurTh(t,min,max).getHexString(); }

/* --- les coefficients U --- */
const lambdaTerre = f => LAM0 - LAMK*f;                  /* la loi du laboratoire */
function Umur(sol){
  const P = TH.parois;
  if (sol === 'parpaingNu')    return P.parpaingNu.U;
  if (sol === 'parpaingIsole') return 1 / (1/P.parpaingNu.U + P.parpaingIsole.Rajoute);
  const f = Math.min(2.5, pct(CONT.FIBRES));             /* la recette du visiteur */
  return 1 / (TH.Rsi + TH.epaisseurMurTerre/lambdaTerre(f) + TH.Rse);
}
const Utoit = () => 1 / (TH.RsiToit + TH.parois.toiture.R + TH.Rse);

let murChoisi = 'terre', consigne6 = TH.consigneDefaut, enThermique = false;

/* ----------------------------------------------------------------------------
   LES DÉPERDITIONS DE L'ENVELOPPE
   Un halo coloré, c'est joli ; un halo qui coûte quelque chose, c'est un
   argument. On additionne donc, sur la maison réellement modélisée :
       HT = Σ U·A  +  Σ ψ·L          (W/K)
       P  = HT · ΔT                  (W)
   TRANSMISSION SEULE : ni renouvellement d'air, ni fuites, ni apports.
   Coefficients et sources : donnees.js > thermique (voir le pupitre).
   ---------------------------------------------------------------------------- */
function deperditions(){
  const P = TH.ponts, dT = consigne6 - TH.exterieurHiver;
  const pte = baieDe('porte'), fen = baieDe('fenetre');
  const larg = b => b.x1 - b.x0, haut = b => hautBaie(b) - basBaie(b);
  const Ap = larg(pte)*haut(pte), Af = larg(fen)*haut(fen);
  const Hm = HAUT - SOUBA;
  const Amur  = 2*LONG*Hm + 2*PROF*Hm - Ap - Af;
  const Atoit = LONG*PROF/Math.cos(PENTE);
  const Lperim = 2*(LONG + PROF);
  const psiBaie = b => P.appui*larg(b) + P.linteau*larg(b) + P.tableau*2*haut(b);
  const HT = Umur(murChoisi)*Amur + Utoit()*Atoit
           + TH.parois.porte.U*Ap + TH.parois.fenetre.U*Af
           + P.plancherBas*Lperim + P.toiture*Lperim + P.angle*4*Hm
           + psiBaie(pte) + psiBaie(fen);
  return { HT, W: HT*dT, kwhJour: HT*dT*24/1000, Amur, Atoit, Ap, Af, dT };
}
/* le compteur : une seconde de stand vaut une heure de chauffage. On l'écrit. */
let kwhCompteur = 0, tCompteur = 0;
function animCompteur(){
  if (!enThermique || phase !== 'hiver'){ tCompteur = 0; return; }
  const now = performance.now();
  if (!tCompteur){ tCompteur = now; return; }
  const h = (now - tCompteur)/1000;          /* 1 s réelle = 1 h de chauffage */
  tCompteur = now;
  kwhCompteur += deperditions().W/1000 * h;
}

/* ----------------------------------------------------------------------------
   LE CHAMP DE TEMPÉRATURE DE SURFACE
   Une façade ne prend pas une seule température : elle est plus chaude là où
   la chaleur trouve un raccourci. On calcule donc, en tout point (x, y) du
   nu extérieur, la densité de flux locale — le courant de la paroi, plus la
   contribution des liaisons — et on en déduit la température de surface.

       q(x,y) = U·ΔT  +  Σ  (ψᵢ·ΔT / d) · exp(−rᵢ/d)
       Tse    = Te + q · Rse

   rᵢ est la distance à la liaison i, d sa longueur d'étalement. L'intégrale
   de chaque terme sur le mur vaut exactement ψᵢ·ΔT : le bilan est conservé.
   C'est une approximation 2D, pas un calcul aux éléments finis.
   ---------------------------------------------------------------------------- */
function champT(x, y){
  const Te = TH.exterieurHiver, dT = consigne6 - Te, Rse = TH.Rse, P = TH.ponts;
  const pte = baieDe('porte'), fen = baieDe('fenetre');
  const dans = b => x > b.x0 && x < b.x1 && y > basBaie(b) && y < hautBaie(b);
  if (dans(pte)) return Te + TH.parois.porte.U   * Rse * dT;
  if (dans(fen)) return Te + TH.parois.fenetre.U * Rse * dT;
  if (y < SOUBA) return Te;                         /* soubassement : hors enveloppe */
  if (Math.abs(x) > LONG/2 || y > HAUT) return Te;  /* ciel, sol, débord */

  let q = Umur(murChoisi) * dT;
  const d = P.longueur;
  const ajout = (psi, r) => { if (psi) q += (psi*dT/d) * Math.exp(-Math.max(0,r)/d); };
  ajout(P.plancherBas, y - SOUBA);
  ajout(P.toiture,     HAUT - y);
  ajout(P.angle,       LONG/2 - Math.abs(x));
  for (const b of [pte, fen]){
    const yb = basBaie(b), yh = hautBaie(b);
    if (x >= b.x0 && x <= b.x1){
      if (y > yh) ajout(P.linteau, y - yh);
      else if (y < yb) ajout(P.appui, yb - y);
    } else {
      const dx = x < b.x0 ? b.x0 - x : x - b.x1;
      const dy = y < yb ? yb - y : (y > yh ? y - yh : 0);
      ajout(P.tableau, Math.hypot(dx, dy));
    }
  }
  return Te + q * Rse;
}

/* valeurs de référence + bornes de l'échelle, relevées sur le champ */
let cacheTS = null, cleTS = '';
function tempsSurface(){
  const cle = murChoisi + '|' + consigne6 + '|' + Math.round(pct(CONT.FIBRES)*100);
  if (cacheTS && cleTS === cle) return cacheTS;
  const Te = TH.exterieurHiver, dT = consigne6 - Te, Rse = TH.Rse;
  const t = {
    mur:     Te + Umur(murChoisi) * Rse * dT,      /* le mur courant, loin des liaisons */
    fenetre: Te + TH.parois.fenetre.U * Rse * dT,
    porte:   Te + TH.parois.porte.U   * Rse * dT,
    toit:    Te + Utoit() * Rse * dT,
    froid:   Te, interieur: Te
  };
  /* le point le plus chaud du mur : on balaie le nu extérieur */
  let chaud = t.mur;
  for (let i=0; i<=48; i++) for (let j=0; j<=40; j++){
    const x = -LONG/2 + (LONG*i)/48, y = SOUBA + ((HAUT-SOUBA)*j)/40;
    const v = champT(x, y);
    if (v > chaud) chaud = v;
  }
  t.pont = chaud;
  t.min = Te - 0.15;
  t.max = Math.max(t.pont, t.fenetre, t.porte, t.toit) + 0.15;
  cacheTS = t; cleTS = cle;
  return t;
}

const PUP_W = 521, PUP_H = 218;                  /* 1,24 m × 0,52 m à 420 px/m */

/* le même dessin, en HTML, pour l'écran plat : au casque c'est le panneau 3D
   qui sert, à l'écran c'est celui-ci — jamais les deux en même temps. */
function majPupitreHTML(){
  const c = S('pupitre'); if (!c) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  /* on plafonne la hauteur : l'image thermique doit rester la plus grande chose à l'écran */
  const wMax = Math.min(560, innerWidth - 28);
  const h = Math.min(156, Math.round(wMax * PUP_H / PUP_W));
  const w = Math.round(h * PUP_W / PUP_H);
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
  c.style.width = w+'px'; c.style.height = h+'px';
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.scale(w/PUP_W, w/PUP_W);
  dessinPupitre(g, PUP_W, PUP_H);
}

let sauvegardeMat = null;
function taguerThermique(){
  for (const b of briques) b.userData.th = 'mur';
  gMaison.traverse(o => { if (o.isMesh) o.userData.th = 'mur'; });
  /* le mortier de fond et l'arase font partie du mur : sans cela, le réticule
     lit « fond » là où l'image montre un mur. */
  const pe = gMaison.userData.pente;
  if (pe) pe.traverse(o => { if (o.isMesh) o.userData.th = 'toit'; });
  const F = gChantier.userData.fenetre, P = gChantier.userData.porte;
  for (const o of F.chauds) o.userData.th = 'fenetre';
  for (const o of F.froids) o.userData.th = 'froid';
  for (const o of P.chauds) o.userData.th = 'porte';
  for (const o of P.froids) o.userData.th = 'froid';
  if (gChantier.userData.soubassement) gChantier.userData.soubassement.userData.th = 'froid';
  /* filet de sécurité : toute pièce oubliée qui se trouve dans l'épaisseur du
     mur (linteaux, petits bois…) appartient au mur, pas au fond froid. */
  const pw = new THREE.Vector3();
  gChantier.traverse(o => {
    if (!o.isMesh || o.userData.th) return;
    o.getWorldPosition(pw);
    const z = pw.z - ZC;
    if (z > -2.05 && z < -1.62 && pw.y > SOUBA) o.userData.th = 'mur';
  });
}
const centreMonde = new THREE.Vector3();
function peindreThermique(){
  const T = tempsSurface();
  gChantier.traverse(o => {
    if (!o.isMesh || o === pupitre || gHiver === o.parent) return;
    if (o.userData.fusion){ peindreFusion(o, T); return; }
    const k = o.userData.th || 'froid';
    let t;
    if (k === 'mur' || k === 'fenetre' || k === 'porte'){
      /* chaque élément prend la température du champ à l'endroit où il est :
         c'est ce qui fait apparaître les halos autour des liaisons */
      o.getWorldPosition(centreMonde);
      t = champT(centreMonde.x, centreMonde.y);
    } else {
      t = (T[k] !== undefined) ? T[k] : T.froid;
    }
    o.material = matTh(couleurTh(t, T.min, T.max));
  });
  scene.background = couleurTh(T.min, T.min, T.max);
}
function vueThermique(on){
  enThermique = on;
  if (on){
    if (!sauvegardeMat){
      sauvegardeMat = [];
      gChantier.traverse(o => { if (o.isMesh && gHiver !== o.parent) sauvegardeMat.push([o, o.material]); });
    }
    taguerThermique(); peindreThermique();
    for (const l of [jour, cielHiver]) l.intensity = 0;
    dire('La chaleur qui sort du bâtiment, rendue visible.');
  } else {
    if (sauvegardeMat) for (const [o,m] of sauvegardeMat) o.material = m;
    restaurerFusion();
    scene.background = cielHiverFond;
    jour.intensity = 0.85; cielHiver.intensity = 0.55;
    dire(moins(TH.exterieurHiver) + ' °C dehors. Le chauffage tourne à l’intérieur.');
  }
  rafraichir6();
}


/* ----------------------------------------------------------------------------
   LE VISEUR DE LA CAMÉRA
   Repris de la mise en page d'une caméra thermique de terrain : échelle
   verticale à droite, boîtes MAX et MIN, réticule central avec sa lecture,
   barre d'état en bas. Le bandeau SIMULATION est là pour que personne ne
   confonde cette image calculée avec un vrai thermogramme.
   ---------------------------------------------------------------------------- */
const rayonVise = new THREE.Raycaster();
function tempSousReticule(px, py){
  const r = renderer.domElement.getBoundingClientRect();
  const p = new THREE.Vector2(((px-r.left)/r.width)*2-1, -((py-r.top)/r.height)*2+1);
  rayonVise.setFromCamera(p, camera);
  const visibleReel = o => { for (let n=o; n; n=n.parent) if (!n.visible) return false; return true; };
  const h = rayonVise.intersectObject(gChantier, true)
                     .filter(o => visibleReel(o.object) && o.object.parent !== gHiver
                                  && o.object.material && o.object.material.visible !== false)[0];
  const T = tempsSurface();
  if (!h) return { t:T.min, d:null, quoi:'ciel' };
  const k = h.object.userData.th || 'froid';
  /* pour une surface de façade, on relit le champ à l'endroit même où l'objet
     a été coloré : la valeur affichée et la couleur sous le réticule sont
     alors forcément la même chose. */
  if (k === 'mur' || k === 'fenetre' || k === 'porte'){
    const c = centreTouche(h);
    return { t: champT(c.x, c.y), d: h.distance, quoi:k };
  }
  return { t: (T[k] !== undefined ? T[k] : T.froid), d: h.distance, quoi:k };
}

const NOMS_TH = { mur:'Mur courant', pont:'Pont therm.', fenetre:'Fenêtre', porte:'Porte',
                  toit:'Toiture', froid:'Fond', ciel:'Ciel' };
const CLES_TH = ['pont','mur','fenetre','porte','toit'];

function boiteHud(g, x, y, titre, valeur, align){
  g.font = 'bold 9.5px Segoe UI, sans-serif';

  g.font = 'bold 15px Segoe UI, sans-serif';

  const xx = align === 'droite' ? x - w : x;
  g.fillStyle = 'rgba(10,8,14,.72)'; rr(g, xx, y, w, 34, 6); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; rr(g, xx, y, w, 34, 6); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#C8C2D6'; g.font = 'bold 9.5px Segoe UI, sans-serif';
  g.fillText(titre, xx + w/2, y + 10);
  g.fillStyle = '#FFFFFF'; g.font = 'bold 15px Segoe UI, sans-serif';
  g.fillText(valeur, xx + w/2, y + 24);
  return { x:xx, w };
}

function dessinCamHud(g, W, H, haut, bas, marqueurs, lecture){
  const T = tempsSurface();
  g.clearRect(0,0,W,H);
  const pad = 14;

  /* équerres de cadrage */
  const cx0 = pad, cx1 = W-pad, cy0 = haut+pad, cy1 = bas-pad, L = 26;
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2.5;
  for (const [ax,ay,dx,dy] of [[cx0,cy0,1,1],[cx1,cy0,-1,1],[cx0,cy1,1,-1],[cx1,cy1,-1,-1]]){
    g.beginPath(); g.moveTo(ax+dx*L, ay); g.lineTo(ax, ay); g.lineTo(ax, ay+dy*L); g.stroke();
  }

  /* échelle verticale, le chaud en haut */
  const bw = 20, bx = W - pad - bw - 4, by0 = haut + 112, by1 = bas - 92;
  const grad = g.createLinearGradient(0, by1, 0, by0);
  for (let i=0;i<RAMPE.length;i++) grad.addColorStop(i/(RAMPE.length-1), '#'+RAMPE[i].getHexString());
  g.fillStyle = grad; rr(g, bx, by0, bw, by1-by0, 4); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5; rr(g, bx, by0, bw, by1-by0, 4); g.stroke();
  const yDe = t => by1 - (by1-by0)*Math.max(0,Math.min(1,(t-T.min)/(T.max-T.min)));
  g.textAlign='center'; g.textBaseline='middle';
  g.font='bold 10px Segoe UI, sans-serif';
  for (const [t, y] of [[T.max, by0+10], [T.min, by1-10]]){
    const s2 = moins(t.toFixed(1).replace('.',','));
    const w = g.measureText(s2).width + 8;
    g.fillStyle='rgba(10,8,14,.72)'; rr(g, bx+bw/2-w/2, y-8, w, 16, 4); g.fill();
    g.fillStyle='#FFFFFF'; g.fillText(s2, bx+bw/2, y);
  }
  /* les quatre parois, repérées sur l'échelle — on écarte les étiquettes
     qui tomberaient l'une sur l'autre, sinon rien n'est lisible */
  g.font='bold 10px Segoe UI, sans-serif';
  const ordre = CLES_TH.map(k => ({ k, yb: yDe(T[k]) })).sort((a,b) => a.yb - b.yb);
  let precedent = -1e9;
  for (const o of ordre){
    o.ye = Math.max(o.yb, precedent + 19);
    precedent = o.ye;
  }
  const debord = precedent - (by1 - 4);
  if (debord > 0) for (const o of ordre) o.ye -= debord;
  for (const o of ordre){
    g.strokeStyle='#FFFFFF'; g.lineWidth=2;
    g.beginPath(); g.moveTo(bx-4, o.yb); g.lineTo(bx+bw+4, o.yb); g.stroke();
    const lib = NOMS_TH[o.k];
    const w = g.measureText(lib).width + 10;
    g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(bx-4, o.yb); g.lineTo(bx-10, o.ye); g.stroke();
    g.fillStyle='rgba(10,8,14,.78)';
    rr(g, bx-10-w, o.ye-8, w, 16, 4); g.fill();
    g.fillStyle='#FFFFFF'; g.textAlign='center';
    g.fillText(lib, bx-10-w/2, o.ye);
    g.textAlign='right';
  }

  /* lecture centrale */
  const lx = W/2, ly = haut + 30;
  g.font='bold 22px Segoe UI, sans-serif';
  const lw = g.measureText(lecture.txt).width + 34;
  g.fillStyle='rgba(10,8,14,.78)'; rr(g, lx-lw/2, ly-18, lw, 38, 8); g.fill();
  g.strokeStyle='rgba(255,255,255,.45)'; g.lineWidth=1.5; rr(g, lx-lw/2, ly-18, lw, 38, 8); g.stroke();
  g.fillStyle='#FFFFFF'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(lecture.txt, lx, ly+2);

  /* boîtes MAX / MIN */
  const chaud = CLES_TH.reduce((a,b)=> T[a]>T[b]?a:b);
  const froid = CLES_TH.reduce((a,b)=> T[a]<T[b]?a:b);
  boiteHud(g, pad+6, haut+58, 'MAX · ' + NOMS_TH[chaud], moins(T[chaud].toFixed(1).replace('.',',')) , 'gauche');
  boiteHud(g, W-pad-6, haut+58, 'MIN · ' + NOMS_TH[froid], moins(T[froid].toFixed(1).replace('.',',')) , 'droite');

  /* réticule */
  const rx = W/2, ry = (haut+bas)/2 + 14;
  g.strokeStyle='#FFFFFF'; g.lineWidth=2;
  g.beginPath();
  g.moveTo(rx-16, ry); g.lineTo(rx-5, ry); g.moveTo(rx+5, ry); g.lineTo(rx+16, ry);
  g.moveTo(rx, ry-16); g.lineTo(rx, ry-5); g.moveTo(rx, ry+5); g.lineTo(rx, ry+16);
  g.stroke();
  g.beginPath(); g.arc(rx, ry, 3.2, 0, 7); g.stroke();

  /* repères sur l'image (écran plat seulement) */
  g.font='bold 10px Segoe UI, sans-serif';
  for (const m of marqueurs){
    g.strokeStyle='#FFFFFF'; g.lineWidth=2;
    g.beginPath();
    g.moveTo(m.x-9, m.y); g.lineTo(m.x+9, m.y); g.moveTo(m.x, m.y-9); g.lineTo(m.x, m.y+9);
    g.stroke();
    const w = g.measureText(m.lib).width + 10;
    const xg = (m.x + 11 + w > bx - 14) ? m.x - 11 - w : m.x + 11;
    g.fillStyle='rgba(10,8,14,.78)';
    rr(g, xg, m.y-8, w, 16, 4); g.fill();
    g.fillStyle='#FFFFFF'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(m.lib, xg+w/2, m.y);
  }

  /* barre d'état */
  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle='rgba(10,8,14,.72)'; rr(g, pad+6, bas-46, W-2*pad-12, 26, 6); g.fill();
  g.fillStyle='#D8D2E2'; g.font='11px Segoe UI, sans-serif';
  const d = new Date();
  const dd = n => String(n).padStart(2,'0');
  g.fillText(dd(d.getDate())+'/'+dd(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)
           + '  ' + dd(d.getHours())+':'+dd(d.getMinutes())+':'+dd(d.getSeconds())
           + (lecture.d ? '    D : ' + lecture.d.toFixed(2).replace('.',',') + ' m' : ''),
           pad+16, bas-33);
  g.textAlign='right';
  g.fillStyle='#F49A24'; g.font='bold 11px Segoe UI, sans-serif';
  /* pas d'émissivité affichée : on ne mesure aucun rayonnement, on calcule
     directement une température de surface. L'afficher serait un décor trompeur. */
  g.fillText('ÉCHELLE AUTO', W-pad-16, bas-33);

  /* le bandeau qui empêche toute confusion avec une vraie mesure */
  g.textAlign='center';
  const bt = 'SIMULATION — températures calculées, modèle 1D';
  g.font='bold 11px Segoe UI, sans-serif';
  const bwd = g.measureText(bt).width + 22;
  g.fillStyle='rgba(155,44,27,.88)'; rr(g, W/2-bwd/2, bas-78, bwd, 22, 5); g.fill();
  g.fillStyle='#FFFFFF'; g.fillText(bt, W/2, bas-67);
}

let tHud = 0, tPup = 0;
function majCamHud(dt){
  const c = S('camhud');
  if (!c) return;
  const actif = enThermique && phase === 'hiver' && !renderer.xr.isPresenting;
  c.hidden = !actif;
  if (!actif) return;
  tHud += dt; if (tHud < 0.10) return; tHud = 0;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = innerWidth, Hh = innerHeight;
  if (c.width !== Math.round(W*dpr) || c.height !== Math.round(Hh*dpr)){
    c.width = Math.round(W*dpr); c.height = Math.round(Hh*dpr);
    c.style.width = W+'px'; c.style.height = Hh+'px';
  }
  const g = c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const ui = S('ui');
  const bas = ui ? Math.max(180, Hh - ui.getBoundingClientRect().height) : Hh;
  /* en mode vitrine, le bandeau du haut masquait la lecture du réticule */
  const vit = S('vitrine');
  const haut = (vit && !vit.hidden) ? Math.round(vit.getBoundingClientRect().bottom) : 0;

  const rx = W/2, ry = (haut+bas)/2 + 14;
  const vu = tempSousReticule(rx, ry);
  const lecture = { txt: moins(vu.t.toFixed(1).replace('.',',')) + ' °C', d: vu.d };

  /* deux repères posés sur l'image, comme les points de mesure d'une caméra */
  const T = tempsSurface();
  const F = gChantier.userData.fenetre, P = gChantier.userData.porte;
  const pts = [
    { k:'mur',  lib:'Mur', v:new THREE.Vector3(xM(4)+BL/2, Y0 + 9*HRANG, -1.79) },
    { k:'pont', lib:'Pont', v:new THREE.Vector3(xM(4)+BL/2, HAUT - 0.07, -1.79) },
    { k:'fenetre', lib:'Fenêtre', v:new THREE.Vector3(F.cx, F.cy, -1.76) },
    { k:'porte',   lib:'Porte',   v:new THREE.Vector3(P.cx, (P.yB+P.yH)/2, -1.74) }
  ];
  const marqueurs = [];
  for (const p of pts){
    const v = p.v.clone(); gChantier.localToWorld(v); v.project(camera);
    if (v.z > 1) continue;
    const x = (v.x*0.5+0.5)*W, y = (-v.y*0.5+0.5)*Hh;
    if (x < 60 || x > W-52 || y < haut+118 || y > bas-96) continue;
    marqueurs.push({ x, y, lib: p.lib + ' ' + moins(T[p.k].toFixed(1).replace('.',',')) + '°' });
  }
  dessinCamHud(g, W, Hh, haut, bas, marqueurs, lecture);
}

/* ============================================================================
   ACTE 0 — L'ÉCRAN D'OPTIMISATION
   Avant de toucher à la matière, le visiteur dit ce qu'il veut : de la
   résistance, de l'isolation, ou un compromis. Le modèle du laboratoire
   cherche alors le meilleur dosage POUR CE CRITÈRE — pas dans l'absolu.
   Deux visiteurs qui choisissent différemment repartent avec deux recettes
   différentes : c'est tout le sujet de l'optimisation multicritère.

   Méthode : fonction de désirabilité de Derringer et Suich (1980). Chaque
   réponse est ramenée entre 0 et 1 sur le domaine mesuré, et on maximise
   leur moyenne géométrique.
   ============================================================================ */
const OPT = DONNEES.optimisation;
const BORNES = (() => {
  const [f0,f1] = OPT.domaineFibres;
  let rcMin=Infinity, rcMax=-Infinity, lMin=Infinity, lMax=-Infinity;
  for (let f=f0; f<=f1+1e-9; f+=0.005){
    const r=rc(f), l=lam(f);
    if(r<rcMin)rcMin=r; if(r>rcMax)rcMax=r;
    if(l<lMin)lMin=l;  if(l>lMax)lMax=l;
  }
  return { f0, f1, rcMin, rcMax, lMin, lMax };
})();
const dRc  = f => (rc(f) - BORNES.rcMin) / (BORNES.rcMax - BORNES.rcMin);
const dLam = f => (BORNES.lMax - lam(f)) / (BORNES.lMax - BORNES.lMin);
function desirabilite(f, k){
  if (k === 'meca')   return dRc(f);
  if (k === 'thermo') return dLam(f);
  return Math.sqrt(Math.max(0,dRc(f)) * Math.max(0,dLam(f)));
}
function optimiser(k){
  let bf = BORNES.f0, bD = -1;
  for (let f=BORNES.f0; f<=BORNES.f1+1e-9; f+=0.005){
    const d = desirabilite(f, k);
    if (d > bD){ bD = d; bf = f; }
  }
  bf = Math.round(bf*100)/100;
  const e = OPT.eauOptimale;
  return { critere:k, f:bf, e, D:bD, rc: rc(bf)*penal(e), lam: lam(bf) };
}
const CRITERES = [
  ['meca',      'RÉSISTANCE',  'la plus solide'],
  ['equilibre', 'ÉQUILIBRE',   'le compromis'],
  ['thermo',    'ISOLATION',   'la plus isolante']
];
const NOM_CRIT = { meca:'Résistance', equilibre:'Équilibre', thermo:'Isolation' };

/* --- le dessin de l'écran --- */
const nb = (v,n) => Number(v).toFixed(n).replace('.',',');
function dessinEcran(g, W, H){

function choisirCritere(k){

function passerAuPlanDeTravail(){
  if (phase !== 'ecran') return;

    ticket.rotation.y = -0.17*k;

];

/* ===================== REGARD ===================== */
/* l'assiette du regard dans la cuisine : le bandeau du bas mange un quart de
   l'image, il faut donc viser un peu plus bas que le centre géométrique. */
const PITCH_CUISINE = -0.38;
let drag=false,lx=0,ly=0,yaw=0,pitch=PITCH_CUISINE;
let pdX=0, pdY=0, pdT=0;           /* pour distinguer un appui d'un glissement */
let vYaw=0, vPitch=0;              /* inertie : un geste lancé continue un peu */
const SENS=0.0062;                 /* radians par pixel — monter pour tourner plus vite */
const PITCH_MIN=-1.05, PITCH_MAX=0.45;   /* le lacet, lui, est libre sur 360° */
let geste = null;      /* 'verser' | 'remuer' | null : sinon on pivote */
let pointToucher = null;   /* où le doigt a touché le mur, à l'acte 5 */
function debut(x,y){
  drag=true; lx=pdX=x; ly=pdY=y; pdT=performance.now(); vYaw=vPitch=0;
  if (renderer.xr.isPresenting) return;
  const c = viser(x,y);
  if (c && c.quoi==='bocal'){ geste='verser'; debutVersement(c.nom); }
  else if (c && c.quoi==='bol'){ geste='remuer'; audioDemarre(); }
  else if (c && c.quoi==='moule'){ geste='moule'; }
  else if (c && c.quoi==='crit'){ geste='crit:'+c.nom; }
  else if (c && c.quoi==='four'){ geste='four'; }
  else if (c && c.quoi==='claie'){ geste='claie'; }
  else if (c && c.quoi==='sol'){ geste='sol:'+c.nom; }
  else if (c && c.quoi==='clef'){ geste='clef'; }
  else if (c && c.quoi==='toucher'){ geste='toucher'; pointToucher = c.p; }
  else if (c && c.quoi==='fin'){ geste='fin'; }
  else if (c && c.quoi==='mur6'){ geste='mur6:'+c.nom; }
  else if (c && c.quoi==='cons6'){ geste='cons6:'+c.nom; }
  else if (c && c.quoi==='cam6'){ geste='cam6'; }
  else if (c && c.quoi==='fin6'){ geste='fin6'; }
  else geste=null;
}
function bouge(x,y){
  if(!drag||renderer.xr.isPresenting) return;
  if (geste && geste!=='remuer') { lx=x; ly=y; return; }  /* on agit : la vue ne bouge pas */
  if (geste==='remuer') { remuer(Math.min(0.05, Math.hypot(x-lx,y-ly)/260)); lx=x; ly=y; return; }
  const dx=(x-lx)*SENS, dy=(y-ly)*SENS;
  yaw  -= dx;                                        /* lacet libre : on fait le tour */
  pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch - dy));
  vYaw = -dx; vPitch = -dy;
  lx=x; ly=y;
}
function fin(x,y,ev){
  if (geste==='verser') finVersement();
  else if (geste==='moule') mouler();
  else if (geste==='remuer') sonRemuer(false);
  else if (geste && geste.startsWith('crit:')) choisirCritere(geste.slice(5));
  else if (geste==='four')  prendreChemin('four');
  else if (geste==='claie') prendreChemin('claie');
  else if (geste && geste.startsWith('sol:')) basculer(geste.slice(4));
  else if (geste === 'clef') poserClef(false);
  else if (geste === 'toucher' && pointToucher) toucherMur(gDedans.worldToLocal(pointToucher.clone()));
  else if (geste === 'fin') ouvrirActe6();
  else if (geste && geste.startsWith('mur6:'))  choisirMur(geste.slice(5));
  else if (geste && geste.startsWith('cons6:')) choisirConsigne(+geste.slice(6));
  else if (geste === 'cam6'){ vueThermique(!enThermique); commenter6(); }
  else if (geste === 'fin6') nuitPuisFin();
  geste=null; drag=false;
}
const el = renderer.domElement;

el.addEventListener('pointerdown',e=>{ el.setPointerCapture&&el.setPointerCapture(e.pointerId); debut(e.clientX,e.clientY); });

/* ---- les manettes : on vise, on maintient, on relâche, comme au doigt ---- */
const mainsGeste = [null, null];
const rayonsVR = [];
function creerRayonVR(c){
  const geo = new THREE.CylinderGeometry(0.55, 1, 1, 10, 1, true);
  geo.translate(0, 0.5, 0); geo.rotateX(-Math.PI/2);          /* de 0 à -1 sur z, comme le rayon */
  const coeur = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:0xFFF4E2, transparent:true,
    opacity:0.95, depthWrite:false, toneMapped:false }));
  coeur.scale.set(0.0024, 0.0024, 1.4); coeur.renderOrder = 15;
  const halo = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:0xE8A860, transparent:true,
    opacity:0.28, depthWrite:false, toneMapped:false, blending:THREE.AdditiveBlending }));
  halo.scale.set(0.0070, 0.0070, 1.4); halo.renderOrder = 14;
  const bout = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 12, 8),
    new THREE.MeshBasicMaterial({ color:0xFFF4E2, toneMapped:false }));
  c.add(coeur, halo, bout);
  /* le réticule : un anneau clair cerclé de sombre, lisible sur la faïence
     blanche comme sur le ciel ; toujours dessiné par-dessus */
  const ret = new THREE.Group(); ret.visible = false;
  const mk = (g, col, op) => { const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color:col,
      transparent:true, opacity:op, depthTest:false, depthWrite:false, toneMapped:false }));
    m.renderOrder = 20; ret.add(m); return m; };
  mk(new THREE.RingGeometry(0.0155, 0.0225, 40), 0x000000, 0.55);
  const anneau = mk(new THREE.RingGeometry(0.0095, 0.0160, 40), 0xFFF4E2, 1);
  const point  = mk(new THREE.CircleGeometry(0.0035, 16), 0xFFF4E2, 1);
  scene.add(ret);
  rayonsVR.push({ c, coeur, halo, ret, anneau, point });
}
const _teteVR = new THREE.Vector3();
function majRayonsVR(){
  if (!renderer.xr.isPresenting){ for (const r of rayonsVR) r.ret.visible = false; return; }
  rig.updateMatrixWorld(true);
  camera.getWorldPosition(_teteVR);
  for (const r of rayonsVR){
    if (!r.c.visible){ r.ret.visible = false; continue; }
    rayon.dernier = null;
    const t = rayonManette(r.c);
    const h = t ? rayon.dernier : null;
    const L = h ? Math.max(0.05, h.distance) : 1.4;
    r.coeur.scale.z = r.halo.scale.z = L;
    /* sur une cible, tout passe à l'orange : on sait qu'on peut appuyer */
    const coul = t ? 0xFFB54D : 0xFFF4E2;
    r.coeur.material.color.setHex(coul); r.anneau.material.color.setHex(coul); r.point.material.color.setHex(coul);
    r.halo.material.opacity = t ? 0.55 : 0.28;
    r.ret.visible = !!h;
    if (h){ r.ret.position.copy(h.point); r.ret.lookAt(_teteVR);
            r.ret.scale.setScalar(Math.max(0.5, h.distance)); }
  }
}
function rayonManette(c){
  const m = new THREE.Matrix4().identity().extractRotation(c.matrixWorld);
  rayon.ray.origin.setFromMatrixPosition(c.matrixWorld);
  rayon.ray.direction.set(0,0,-1).applyMatrix4(m);
  return cibleDuRayon();
}
for (const i of [0,1]){

  /* LES MANETTES VONT AVEC LE VISITEUR. Posées dans la scène, elles

/* Quand la pâte est prête, la cuisine s'organise d'elle-même : le moule
   s'avance devant le visiteur et le saladier s'écarte. Un seul geste reste. */
let avance = 0;
/* la balance se range dès qu'on quitte le plan de travail : à la fin, son
   cadran venait se planter devant la brique du visiteur. */
let balanceRangee = false;
function pretAMouler(){
  return dansMoule || (melange>=0.75 && consistanceOk() && solides()>=400);
}
function animPlan(dt){
  const c = pretAMouler() ? 1 : 0;
  if (Math.abs(avance-c) >= 0.0015 || avance !== c){
    if (Math.abs(avance-c) < 0.0015) avance = c;
    else avance += (c-avance)*Math.min(1, dt*4.5);
    moule.position.lerpVectors(MOULE_A, MOULE_B, avance);
    saladier.position.lerpVectors(SALADIER_A, SALADIER_B, avance);
    majZones();
  }
  /* la balance suit le saladier À CHAQUE IMAGE, même quand rien ne bouge :
     sinon elle reste à l'origine tant que la pâte n'est pas prête. */
  balance.position.set(saladier.position.x, saladier.position.y - H_BAL - RBOL, saladier.position.z);
  balance.visible = saladier.visible && !balanceRangee;
}

/* ---------------------------------------------------------------------------
   LA MATIÈRE VIT : la goutte qui tombe d'une pâte trop mouillée, et les
   miettes qui sautent quand on remue une pâte trop sèche.
   --------------------------------------------------------------------------- */
/* le fil à plomb oscille et s'amortit : trois lignes, et le mur devient un chantier */
function animChantier(){
  const now = performance.now()/1000;
  /* le temps passe pendant que le mur monte : le soleil tourne un peu */
  if (phase === 'mur' && poseIdx > 0 && !clefPosee){
    const k = Math.min(1, poseIdx / briques.length);
    jour.position.set(6.0 - 2.5*k, 8.0 + 0.6*Math.sin(Math.PI*k), ZC + 5.0);
  }
  if (filPlomb.visible){
    const t = now - (filPlomb.userData.t0 || 0)/1000;
    filPlomb.rotation.z = 0.14 * Math.exp(-t/9) * Math.sin(t*2.4);
  }
  /* la brique qu'on tend au visiteur respire, et son emplacement clignote */
  if (clefEnAttente && briqueClef){
    briqueClef.position.y = CLEF_MAIN.y + Math.sin(now*1.7)*0.016;
    briqueClef.rotation.y = 0.24 + Math.sin(now*0.8)*0.10;
    empreinteClef.material.opacity = 0.45 + 0.45*Math.abs(Math.sin(now*2.1));
    haloClef.material.opacity = 0.10 + 0.20*Math.abs(Math.sin(now*2.1));
  }
}
function animMatiere(dt){
  const actifCuisine = (phase === 'cuisine') && !dansMoule && pate.visible;
  const e = eauPct();

  /* --- les miettes --- */
  if (gMiettes.visible){
    const f = gMiettes.userData.f || 0;
    const t = performance.now()/1000;
    const saut = (remueTemps > 0) ? 1 : 0;
    const R = 0.099, sc = pate.scale;
    for (const m of miettes){
      const d2 = m.userData.dir;
      m.position.set(d2.x*R*sc.x,
                     pate.position.y + d2.y*R*sc.y + saut*Math.abs(Math.sin(t*9 + m.userData.ph))*0.018*f,
                     d2.z*R*sc.z);
      if (saut) m.rotation.y += dt*4;
    }
  }

  /* --- la goutte : au temps réel, comme tout le reste du récit, sinon
         elle ne tombe jamais sur une machine lente --- */
  const now = performance.now();
  if (actifCuisine && e > 24){
    if (!tProchaineGoutte) tProchaineGoutte = now + 1800;
    if (t0Chute < 0 && now > tProchaineGoutte){
      t0Chute = now; tProchaineGoutte = 0;
      goutte.visible = true;
      goutte.position.set(saladier.position.x + 0.182, saladier.position.y - 0.052, saladier.position.z + 0.022);
      goutte.userData.y0 = goutte.position.y;
    }
  } else {
    tProchaineGoutte = 0;
    if (t0Chute < 0) goutte.visible = false;
  }
  if (t0Chute >= 0){
    const c = (now - t0Chute)/1000;
    const y = goutte.userData.y0 - 0.5*4.2*c*c;
    goutte.position.y = y;
    goutte.scale.set(1 - 0.25*c, 1 + 0.6*c, 1 - 0.25*c);
    if (y <= PY + 0.006){
      goutte.visible = false; goutte.scale.set(1,1,1); t0Chute = -1;
      tProchaineGoutte = now + 2600;
      flaque.position.set(goutte.position.x, PY + 0.002, goutte.position.z);
      flaque.material.opacity = 0.42; t0Flaque = now;
      audioDemarre(); sonCourt(520, 0.06, 'sine');
    }
  }
  if (t0Flaque > 0){
    const a = 0.42 - (now - t0Flaque)/1000 * 0.08;
    flaque.material.opacity = Math.max(0, a);
    if (a <= 0) t0Flaque = -1;
  }
}

/* ============================================================================
   MODE VITRINE  —  index.html?vitrine
   Un écran posé à côté des casques, qui rejoue l'expérience en boucle pour
   les gens qui attendent. Ce n'est pas un film : c'est la même application,
   qui se pilote elle-même. Aucun chiffre n'y est différent.
   ============================================================================ */
const VITRINE = /[?&]vitrine\b/.test(location.search);
let vitT = 0, vitEtape = 0, vitPhase = '';
function animVitrine(){
  if (!VITRINE) return;
  /* au temps réel : sur un mini-PC lent, un compteur d'images se traînerait */
  const now = performance.now();
  if (now - vitT < 1000) return; vitT = now;
  if (phase !== vitPhase){ vitPhase = phase; vitEtape = 0; }
  vitEtape++;
  switch (phase){
    case 'ecran':
      if (!cible && vitEtape > 2)
        choisirCritere(new URLSearchParams(location.search).get('critere') || ['meca','equilibre','thermo'][Math.floor(Math.random()*3)]);
      break;
    case 'cuisine':
      if (dansMoule) break;
      if (CONT.TERRE < 980){ CONT.TERRE += 190; maj(); }
      else if (CONT.SABLE < 320){ CONT.SABLE += 90; maj(); }
      else if (CONT.FIBRES < 18 + Math.random()*8){ CONT.FIBRES += 5; maj(); }
      else if (eauPct() < 20){ CONT.EAU += 60; maj(); }
      else if (melange < 1){ melange = Math.min(1, melange + 0.34); maj(); }
      else mouler();
      break;
    case 'choix':
      if (vitEtape > 2) prendreChemin(new URLSearchParams(location.search).get('chemin') || (Math.random() < 0.5 ? 'four' : 'claie'));
      break;
    case 'dedans':
      if (vitEtape === 3)  basculer('conventionnel');
      if (vitEtape === 7)  toucherMur(new THREE.Vector3(-0.55, 1.30, Z_MUR-0.10));
      if (vitEtape === 12) basculer('terre');
      if (vitEtape === 16) toucherMur(new THREE.Vector3( 0.55, 1.30, Z_MUR-0.10));
      if (vitEtape >= 21)  ouvrirActe6();
      break;
    case 'hiver':
      if (vitEtape === 3)  { vueThermique(true); commenter6(); }
      if (vitEtape === 9)  choisirMur('parpaingNu');
      if (vitEtape === 15) choisirMur('parpaingIsole');
      if (vitEtape === 21) choisirMur('terre');
      if (vitEtape === 26) choisirConsigne(30);
      if (vitEtape >= 32)  nuitPuisFin();
      break;
    case 'fin':
      if (vitEtape >= 9) location.reload();
      break;
  }
}

/* ============================================================================
   LE COMPTEUR D'IMAGES  —  index.html?fps
   En VR, la fluidité passe avant la beauté : sous 72 images par seconde le
   confort s'effondre. Ce compteur dit ce qu'on peut encore se permettre
   d'ajouter au décor. Il affiche aussi ce que la carte graphique a à tenir :
   nombre d'appels de dessin et de triangles par image.
   ============================================================================ */
const FPS_ACTIF = /[?&]fps\b/.test(location.search);
let fpsForce = false;        /* au casque : bouton B ou Y pour l'afficher */
let fpsN = 0, fpsT0 = 0, fpsMin = 999;
/* Au casque, le HTML n'est plus affiché : le compteur devient une petite
   plaque en haut à gauche du champ de vision. */
const fpsVR = fiche(0.30, 0.105, {l1:'', l2:'', l3:'', c:'#9FD08A'}, (g,W,H,d)=>{
  g.fillStyle='rgba(10,8,6,.80)'; rr(g,0,0,W,H,12); g.fill();
  g.strokeStyle=d.c; g.lineWidth=3; rr(g,3,3,W-6,H-6,10); g.stroke();
  g.textAlign='left'; g.textBaseline='top'; g.fillStyle=d.c;
  g.font='bold 30px monospace'; g.fillText(d.l1, 14, 8);
  g.font='22px monospace'; g.fillText(d.l2, 14, 44); g.fillText(d.l3, 14, 70);
}, 1000);
fpsVR.position.set(-0.30, 0.24, -0.95);
fpsVR.renderOrder = 12; fpsVR.material.depthTest = false; fpsVR.visible = false;
camera.add(fpsVR);
function animFps(){
  if (!FPS_ACTIF && !fpsForce){ if (fpsVR.visible) fpsVR.visible = false; return; }
  const e = S('fps'); if (!e) return;
  const now = performance.now();
  if (!fpsT0){ fpsT0 = now; e.hidden = false; return; }
  fpsN++;
  if (now - fpsT0 < 500) return;
  const f = fpsN * 1000 / (now - fpsT0);
  fpsN = 0; fpsT0 = now;
  if (f < fpsMin && f > 1) fpsMin = f;
  const info = renderer.info.render;
  const l1 = f.toFixed(0) + ' im/s   min ' + fpsMin.toFixed(0);
  const l2 = info.calls + ' appels   ' + Math.round(info.triangles/1000) + ' k tri';
  e.textContent = l1 + '\n' + l2 + '\n' + phase;
  e.className = f >= 70 ? '' : (f >= 55 ? 'bas' : 'rouge');
  fpsVR.visible = renderer.xr.isPresenting;
  if (fpsVR.visible){
    Object.assign(fpsVR.userData, { l1, l2, l3: phase,
      c: f >= 70 ? '#9FD08A' : (f >= 55 ? '#F2B36A' : '#F07A5A') });
    fpsVR.userData.redraw();
  }
}

function calerHauteur(){
  if (!renderer.xr.isPresenting) return;
  const h = camera.position.y;           /* hauteur réelle des yeux, repère « local-floor » */
  if (!(h > 0.6 && h < 2.3)) return;     /* lecture aberrante : on ne touche à rien */
  rigY = Math.max(-0.7, Math.min(0.9, 1.50 - h));
  rig.position.y = rigY;
}
renderer.xr.addEventListener('sessionstart', () => {
  setTimeout(calerHauteur, 600); setTimeout(calerHauteur, 1800);
  recitMontrer();
});
renderer.xr.addEventListener('sessionend', () => { rigY = 0; rig.position.y = 0; });

   L'AMBIANCE — lumière, poids des objets, son, matière qui vit
   Tout ce qui suit est du décor : aucune valeur scientifique n'en dépend.

/* ---- un disque blanc à bord doux, pour toutes les particules ---- */
function spriteDoux(dur){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(dur || 0.35, 'rgba(255,255,255,.55)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const SPRITE = spriteDoux(0.30);

/* ---------------------------------------------------------------------------
   1. LE POIDS : des ombres de contact sous chaque objet posé
   Les ombres portées en temps réel sont floues et décollées à cette échelle ;
   un dégradé sombre juste sous l'objet suffit à le « poser » sur le plan.
   --------------------------------------------------------------------------- */
const ombreTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(0.45, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
function ombreContact(parent, w, d, x, y, z, force){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ map:ombreTex, transparent:true, opacity:force || 0.45, depthWrite:false,
      toneMapped:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 }));
  m.rotation.x = -Math.PI/2; m.position.set(x, y, z); m.renderOrder = 1;
  parent.add(m); return m;
}
ombreContact(gMiseEnPlace, 0.98, 0.36, 0, PY + 0.0008, ZB, 0.30);          /* la planche */
for (const n in bocaux) ombreContact(bocaux[n], 0.21, 0.21, 0, 0.0009, 0, 0.55);
ombreContact(balance, 0.37, 0.37, 0, 0.0008, 0, 0.50);
ombreContact(moule,   0.38, 0.24, 0, 0.0008, 0, 0.50);
ombreContact(four,    0.44, 0.38, 0, 0.0008, 0, 0.60);
ombreContact(claie,   0.36, 0.28, 0, 0.0008, 0, 0.40);
/* les deux briques bougent : leur ombre les suit et pâlit quand elles montent */
const ombresSuivies = [briqueSeche, briqueTemoin].map(b =>
  ({ b, o: ombreContact(gCuisson, 0.34, 0.20, 0, PY + 0.0008, 0, 0.55) }));
function majOmbres(){
  for (const { b, o } of ombresSuivies){
    if (!b.visible){ o.visible = false; continue; }
    const h = b.position.y - (PY + 0.045);
    const k = Math.max(0, Math.min(1, 1 - h/0.12));
    o.visible = k > 0.02;
    o.position.set(b.position.x, PY + 0.0008, b.position.z);
    o.scale.set(b.scale.x, b.scale.z, 1);
    o.material.opacity = 0.55*k;
  }
}

/* ---------------------------------------------------------------------------
   2. LA MATIÈRE DANS LES BOCAUX
   Une couleur unie se lisait comme du plastique. Chaque ingrédient reçoit sa
   texture : mottes de terre, grains de sable, brins de paille, eau.
   --------------------------------------------------------------------------- */
function textureMatiere(nom, hex){
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const g = c.getContext('2d');
  const R = (hex >> 16) & 255, V = (hex >> 8) & 255, B = hex & 255;
  const teinte = (k, a) => 'rgba(' + Math.min(255, Math.round(R*k)) + ',' + Math.min(255, Math.round(V*k)) + ','
                                   + Math.min(255, Math.round(B*k)) + ',' + (a == null ? 1 : a) + ')';
  let s = 1 + nom.length*977; const rn = () => (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  g.fillStyle = teinte(1); g.fillRect(0, 0, 128, 256);
  if (nom === 'TERRE'){
    for (let i=0;i<1100;i++){ g.fillStyle = teinte(0.72 + rn()*0.45, 0.85);
      g.beginPath(); g.arc(rn()*128, rn()*256, 1 + rn()*3.6, 0, 7); g.fill(); }
    for (let i=0;i<60;i++){ g.fillStyle = teinte(0.55, 0.7);
      g.beginPath(); g.ellipse(rn()*128, rn()*256, 3 + rn()*4, 2 + rn()*3, rn()*3, 0, 7); g.fill(); }
  } else if (nom === 'SABLE'){
    for (let i=0;i<5200;i++){ g.fillStyle = teinte(0.62 + rn()*0.70, 1); g.fillRect(rn()*128, rn()*256, 1.3, 1.3); }
    for (let i=0;i<260;i++){ g.fillStyle = teinte(0.45, 0.9); g.fillRect(rn()*128, rn()*256, 1.6, 1.6); }
  } else if (nom === 'FIBRES'){
    g.fillStyle = teinte(0.80); g.fillRect(0, 0, 128, 256);
    g.lineCap = 'round';
    for (let i=0;i<340;i++){
      const x = rn()*128, y = rn()*256, a = rn()*Math.PI, l = 10 + rn()*34;
      g.strokeStyle = teinte(0.70 + rn()*0.55, 0.95); g.lineWidth = 0.9 + rn()*1.6;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke();
    }
  } else {
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, teinte(1.25)); gr.addColorStop(1, teinte(0.80));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 256);
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.2;

   --------------------------------------------------------------------------- */
function fusionnerBoites(liste, matBase){
  let nV = 0, nI = 0;
  for (const m of liste){ nV += m.geometry.attributes.position.count; nI += m.geometry.index.count; }
  const pos = new Float32Array(nV*3), nor = new Float32Array(nV*3), uv = new Float32Array(nV*2),
        col = new Float32Array(nV*3), idx = new (nV > 65535 ? Uint32Array : Uint16Array)(nI);
  const v = new THREE.Vector3(), nm = new THREE.Matrix3(), centres = [], tri0 = [], comptes = [];
  let ov = 0, oi = 0;
  for (const m of liste){
    m.updateMatrix(); m.updateWorldMatrix(true, false); nm.getNormalMatrix(m.matrix);
    const G = m.geometry, P = G.attributes.position, N = G.attributes.normal, U = G.attributes.uv, I = G.index;
    const c = m.material.color;
    for (let i=0;i<P.count;i++){
      const k = ov + i;
      v.fromBufferAttribute(P, i).applyMatrix4(m.matrix); pos[k*3] = v.x; pos[k*3+1] = v.y; pos[k*3+2] = v.z;
      v.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); nor[k*3] = v.x; nor[k*3+1] = v.y; nor[k*3+2] = v.z;
      if (U){ uv[k*2] = U.getX(i); uv[k*2+1] = U.getY(i); }
      col[k*3] = c.r; col[k*3+1] = c.g; col[k*3+2] = c.b;
    }
    tri0.push(oi/3); comptes.push(P.count);
    for (let j=0;j<I.count;j++) idx[oi+j] = I.getX(j) + ov;
    centres.push(new THREE.Vector3().setFromMatrixPosition(m.matrixWorld));
    ov += P.count; oi += I.count;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  const aNormal = new THREE.BufferAttribute(col, 3);
  geo.setAttribute('color', aNormal);
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeBoundingBox(); geo.computeBoundingSphere();
  const mat = matBase.clone(); mat.vertexColors = true; mat.color.setHex(0xFFFFFF);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.fusion = { centres, tri0, comptes, aNormal,
                           aTh: new THREE.BufferAttribute(new Float32Array(nV*3), 3), matTh: null };
  return mesh;
}

   5. LES PARTICULES : vapeur, poussière de chantier, fumée
   Un seul petit moteur, alpha par particule (couleur RGBA de sommet).
   --------------------------------------------------------------------------- */
function systemeParticules(N, taille, couleur, parent, alphaMax, frein, montee){
  const pos = new Float32Array(N*3), col = new Float32Array(N*4);
  for (let i=0;i<N;i++) pos[i*3+1] = -999;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 4).setUsage(THREE.DynamicDrawUsage));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size:taille, map:SPRITE, vertexColors:true,
    transparent:true, depthWrite:false, toneMapped:false }));
  pts.frustumCulled = false; pts.visible = false; pts.renderOrder = 2; parent.add(pts);
  return { pts, pos, col, N, vies:new Float32Array(N), vie0:new Float32Array(N), vit:new Float32Array(N*3),
           rgb:new THREE.Color(couleur), libre:0, alphaMax, frein, montee, actifs:0 };
}
function emettre(p, x, y, z, vx, vy, vz, vie){
  const i = p.libre; p.libre = (p.libre + 1) % p.N;
  p.pos[i*3] = x; p.pos[i*3+1] = y; p.pos[i*3+2] = z;
  p.vit[i*3] = vx; p.vit[i*3+1] = vy; p.vit[i*3+2] = vz;
  p.vies[i] = vie; p.vie0[i] = vie; p.actifs++;
}
function animerParticules(p, dt){
  if (p.actifs === 0){ p.pts.visible = false; return; }
  let n = 0;
  for (let i=0;i<p.N;i++){
    if (p.vies[i] <= 0){ p.col[i*4+3] = 0; continue; }
    p.vies[i] -= dt; n++;
    const fr = Math.max(0, 1 - p.frein*dt);
    p.vit[i*3] *= fr; p.vit[i*3+2] *= fr; p.vit[i*3+1] += p.montee*dt;
    p.pos[i*3] += p.vit[i*3]*dt; p.pos[i*3+1] += p.vit[i*3+1]*dt; p.pos[i*3+2] += p.vit[i*3+2]*dt;
    const u = 1 - Math.max(0, p.vies[i])/p.vie0[i];
    p.col[i*4] = p.rgb.r; p.col[i*4+1] = p.rgb.g; p.col[i*4+2] = p.rgb.b;
    p.col[i*4+3] = Math.max(0, Math.min(1, u*6) * (1 - u) * p.alphaMax);
  }
  p.actifs = n;
  p.pts.geometry.attributes.position.needsUpdate = true;
  p.pts.geometry.attributes.color.needsUpdate = true;
  p.pts.visible = n > 0;
}

   Chaque bruit est placé là où il naît (HRTF : on l'entend à gauche, à

   --------------------------------------------------------------------------- */
let pannersHRTF = 0;    /* le HRTF coûte du calcul : au-delà de six sons simultanés, panoramique simple */
function sortieAudio(pos, duree){
  if (!pos || !AC.createPanner) return busSortie;
  const p = AC.createPanner();
  const hrtf = !duree || pannersHRTF < 6;
  p.panningModel = hrtf ? 'HRTF' : 'equalpower';
  p.distanceModel = 'inverse'; p.refDistance = 0.8; p.rolloffFactor = 0.9; p.maxDistance = 80;
  if (p.positionX){ p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; }
  else p.setPosition(pos.x, pos.y, pos.z);
  p.connect(busSortie);
  if (duree){ if (hrtf) pannersHRTF++;
    setTimeout(() => { try{ p.disconnect(); }catch(e){} if (hrtf) pannersHRTF--; }, (duree + 0.5)*1000); }
  return p;
}
const _ep = new THREE.Vector3(), _ef = new THREE.Vector3(), _eu = new THREE.Vector3();

    L.upX.value = _eu.x; L.upY.value = _eu.y; L.upZ.value = _eu.z;

const AMB = { cle:null, courant:null, oiseauT:0 };
function bruitFiltre(type, f, q, gain, sortie, arret){
  const s = source(), fi = AC.createBiquadFilter(), g = AC.createGain();
  fi.type = type; fi.frequency.value = f; fi.Q.value = q; g.gain.value = gain;
  s.connect(fi); fi.connect(g); g.connect(sortie); s.start(0, Math.random()*1.8); arret.push(s);
  return { fi, g };
}
function lfo(freq, amp, param, arret, forme){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = forme || 'sine'; o.frequency.value = freq; g.gain.value = amp;
  o.connect(g); g.connect(param); o.start(); arret.push(o);
}
function construireAmbiance(cle){
  const sortie = AC.createGain(); sortie.gain.value = 0; sortie.connect(busSortie);
  const arret = []; let niveau = 1;
  if (cle === 'cuisine'){
    /* le ronron d'un frigo, une pièce calme */
    for (const [f, a] of [[98, 0.010], [196, 0.0035]]){
      const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = a;
      o.connect(g); g.connect(sortie); o.start(); arret.push(o);
    }
    bruitFiltre('lowpass', 240, 0.5, 0.030, sortie, arret);
  } else if (cle === 'chantier'){
    /* le vent dans la campagne */
    const v = bruitFiltre('lowpass', 430, 0.6, 0.060, sortie, arret);
    lfo(0.11, 0.030, v.g.gain, arret);
    const v2 = bruitFiltre('bandpass', 900, 0.8, 0.014, sortie, arret);
    lfo(0.07, 0.010, v2.g.gain, arret);
  } else if (cle === 'ete'){
    /* les cigales, dehors, et la pièce fraîche */
    const c = bruitFiltre('bandpass', 5200, 4, 0.0, sortie, arret);
    const am = AC.createGain(); am.gain.value = 0.5;
    c.g.disconnect(); c.g.gain.value = 0.045; c.g.connect(am); am.connect(sortie);
    lfo(42, 0.5, am.gain, arret, 'sawtooth');
    lfo(0.16, 0.022, c.g.gain, arret);
    bruitFiltre('lowpass', 200, 0.5, 0.018, sortie, arret);
  } else {
    /* le vent d'hiver, plus froid, qui siffle un peu */
    const v = bruitFiltre('bandpass', 650, 0.9, 0.080, sortie, arret);
    lfo(0.06, 260, v.fi.frequency, arret);
    lfo(0.13, 0.045, v.g.gain, arret);
    bruitFiltre('highpass', 2600, 0.7, 0.007, sortie, arret);
    if (cle === 'nuit') niveau = 0.6;
  }
  return { sortie, arret, niveau };
}
function ambianceSon(cle){
  if (AMB.cle === cle) return;
  AMB.cle = cle; const t = AC.currentTime;
  const ancien = AMB.courant;
  if (ancien){
    ancien.sortie.gain.cancelScheduledValues(t);
    ancien.sortie.gain.setValueAtTime(ancien.sortie.gain.value, t);
    ancien.sortie.gain.linearRampToValueAtTime(0, t + 2.5);
    setTimeout(() => { for (const n of ancien.arret) try{ n.stop(); }catch(e){}
                       try{ ancien.sortie.disconnect(); }catch(e){} }, 2900);
  }
  const n = construireAmbiance(cle); AMB.courant = n;
  n.sortie.gain.setValueAtTime(0, t); n.sortie.gain.linearRampToValueAtTime(n.niveau, t + 2.5);
}
function cleAmbiance(){
  if (phase === 'mur') return 'chantier';

}
