<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La cuisine des matériaux</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0C0908; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #F6F0E4; }
  canvas { display: block; }
  /* ---- la narration, en tête du bandeau du bas : un seul bloc de texte à l'écran ---- */
  #consigne2 { font-family: Georgia, serif; font-style: italic;
               font-size: clamp(13px, 3.4vw, 16px); line-height: 1.3; color: #C9B896; }

  /* ---- bandeau du bas : ce qu'on fait, puis ce que ça donne ---- */
  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
        padding: 12px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        background: rgba(14,10,9,.93);
        border-top: 1px solid rgba(200,118,42,.38);
        display: flex; flex-direction: column; gap: 8px; }
  #instr { font-family: Georgia, serif; font-size: clamp(14px, 3.9vw, 18px); line-height: 1.35;
           color: #F8F3E8; }
  #instr b { color: #E8A860; font-weight: 700; }
  #choix, #dedans, #critere { display: flex; gap: 10px; }
  #retrait { display: flex; gap: 8px; align-items: center; }
  #retrait .lib { font-size: 11px; letter-spacing: .10em; text-transform: uppercase;
                  color: #A3907A; font-weight: 700; flex: 0 0 auto; }
  #retrait button { flex: 1 1 0; font: inherit; font-size: 13px; font-weight: 700;
                    padding: 9px 6px; border-radius: 9px; border: 1px solid #5A4634;
                    background: #241C16; color: #E8DDC9; cursor: pointer; }
  #retrait button.actif { background: #C8762A; border-color: #F2C185; color: #17110D; }
  #critere button { flex: 1 1 0; font: inherit; font-size: 14px; font-weight: 700;
                    padding: 11px 6px; border-radius: 10px; border: 1px solid #2C4450;
                    background: #16212733; color: #DCEBF2; cursor: pointer;
                    background-color: #172228; }
  #critere button.actif { background-color: #5FA8C8; border-color: #BFE6F5; color: #0E1418; }
  #hiver { display: flex; flex-direction: column; gap: 6px; }
  #pupitre { display: block; margin: 0 auto 2px; max-width: 100%; border-radius: 12px; }
  #hiver .rang { display: flex; gap: 7px; align-items: center; }
  #hiver .lib { font-size: 11px; letter-spacing: .10em; text-transform: uppercase;
                color: #A3907A; font-weight: 700; flex: 0 0 auto; }
  #hiver button { flex: 1 1 0; font: inherit; font-size: 12.5px; font-weight: 700;
                  padding: 8px 5px; border-radius: 8px; border: 1px solid #5A4634;
                  background: #241C16; color: #E8DDC9; cursor: pointer; }
  #hiver button.actif { background: #C8762A; border-color: #F2C185; color: #17110D; }
  #hiver button.fort { flex: 2 1 0; border-color: #C8762A; }
  #dedans button { flex: 1 1 0; font: inherit; font-size: 15px; font-weight: 700;
                   padding: 12px 8px; border-radius: 10px; border: 1px solid #5A4634;
                   background: #241C16; color: #E8DDC9; cursor: pointer; }
  #bTerre.actif { background: #2E3E28; border-color: #6E9A5A; color: #D8F0C8; }
  #bConv.actif  { background: #3E2C1C; border-color: #C06A2A; color: #F5D9B4; }
  #bFin { flex: 0 0 auto !important; }
  #choix button { flex: 1 1 0; font: inherit; font-size: 15px; font-weight: 700;
                  padding: 12px 8px; border-radius: 10px; border: 1px solid #C8762A;
                  background: #3A2A1C; color: #F8F3E8; cursor: pointer; }
  #choix button:active { background: #C8762A; color: #17110D; }
  #barre { display: flex; gap: 10px; align-items: center; justify-content: space-between;
           border-top: 1px solid rgba(246,240,228,.14); padding-top: 8px; }
  #etat { font-size: 12.5px; line-height: 1.3; color: #D6C6AB; font-variant-numeric: tabular-nums; }
  #btns { display: flex; gap: 8px; flex: 0 0 auto; }
  #barre button { font: inherit; font-size: 12.5px; padding: 7px 11px; border-radius: 8px;
                  border: 1px solid #5A4634; background: #2A211A; color: #F0E6D4; cursor: pointer; }
  /* le bouton « Entrer en VR » de three.js : on le remonte pour qu'il ne chevauche rien */
  #VRButton { top: auto !important; bottom: auto !important; left: auto !important;
              right: 12px !important; margin-top: calc(10px + env(safe-area-inset-top, 0px)) !important;
              position: fixed !important; z-index: 4 !important; width: auto !important;
              padding: 9px 13px !important; font-size: 12px !important;
              border-radius: 9px !important; background: rgba(14,10,9,.9) !important;
              border: 1px solid rgba(200,118,42,.5) !important; color: #F0E6D4 !important; }
  #camhud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  /* ---- compteur d'images : index.html?fps — à garder fermé le jour J ---- */
  #fps { position: fixed; top: calc(6px + env(safe-area-inset-top,0px)); left: 8px; z-index: 5;
         font: 700 12px/1.35 ui-monospace, Menlo, monospace; color: #9FD08A;
         background: rgba(10,8,6,.72); border: 1px solid rgba(159,208,138,.35);
         border-radius: 7px; padding: 5px 8px; pointer-events: none; white-space: pre; }
  #fps.bas { color: #F2B36A; border-color: rgba(242,179,106,.45); }
  #fps.rouge { color: #F07A5A; border-color: rgba(240,122,90,.5); }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; padding: 26px;
           background: #0C0908; text-align: center; z-index: 5; }
  #intro h1 { font-family: Georgia, serif; font-size: clamp(2rem,6.5vw,3.2rem); margin: 0 0 12px; }
  #intro p { color: #B9AB96; line-height: 1.6; max-width: 44ch; margin: 0 auto 22px; font-size: 15px; }
  #go { font: inherit; font-weight: 700; font-size: 17px; padding: 14px 28px; border-radius: 10px;
        border: none; background: #C8762A; color: #17110D; cursor: pointer; }
  /* ---- mode vitrine : l'écran qui tourne tout seul devant la file d'attente ---- */
  #vitrine { position: fixed; top: 0; left: 0; right: 0; z-index: 4;
             padding: calc(9px + env(safe-area-inset-top,0px)) 16px 9px;
             background: rgba(14,10,9,.86); border-bottom: 1px solid rgba(200,118,42,.45);
             display: flex; gap: 12px; align-items: baseline; justify-content: center;
             font-size: clamp(12px,2.6vw,15px); }
  #vitrine b { color: #E8A860; letter-spacing: .06em; }
  #vitrine span { color: #B9AB96; }
  body.vitrine #choix, body.vitrine #dedans, body.vitrine #critere,
  body.vitrine #retrait, body.vitrine #btns, body.vitrine #hiver .rang { display: none !important; }
</style>
</head>
<body>

<div id="intro">
  <div>
    <h1>La cuisine des matériaux</h1>
    <p>Aujourd'hui, on cuisine un mur. Quatre ingrédients, une pâte, un moule — et une question à la fin : faut-il le cuire ?</p>
    <button id="go" type="button">Entrer en cuisine</button>
  </div>
</div>

<div id="vitrine" hidden><b>DÉMONSTRATION EN BOUCLE</b>
  <span>l’expérience complète se vit au casque — demandez à un animateur</span></div>

<div id="fps" hidden></div>

<canvas id="camhud" hidden></canvas>

<div id="ui" hidden>
  <div id="consigne2"></div>
  <div id="instr"></div>
  <div id="critere" hidden>
    <button id="cMeca" type="button">Résistance</button>
    <button id="cEq" type="button">Équilibre</button>
    <button id="cTherm" type="button">Isolation</button>
  </div>
  <div id="retrait" hidden>
    <span class="lib">Retrait</span>
    <button id="rx1" type="button" class="actif">Échelle réelle</button>
    <button id="rx20" type="button">Amplifiée ×20</button>
  </div>
  <div id="choix" hidden>
    <button id="bFour" type="button">Étuve 50 °C</button>
    <button id="bClaie" type="button">Séchage naturel</button>
  </div>
  <div id="dedans" hidden>
    <button id="bTerre" type="button">Terre crue</button>
    <button id="bConv" type="button">Conventionnel</button>
    <button id="bFin" type="button" hidden>Sortir voir</button>
  </div>
  <div id="hiver" hidden>
    <canvas id="pupitre"></canvas>
    <div class="rang">
      <button id="h_terre" type="button">Terre + fibres</button>
      <button id="h_nu" type="button">Parpaing nu</button>
      <button id="h_iso" type="button">Parpaing isolé</button>
    </div>
    <div class="rang">
      <span class="lib">Chauffage</span>
      <button id="h_20" type="button">20 °C</button>
      <button id="h_30" type="button">30 °C</button>
      <button id="h_40" type="button">40 °C</button>
    </div>
    <div class="rang">
      <button id="h_cam" type="button" class="fort">Caméra thermique</button>
      <button id="h_fin" type="button">Terminer</button>
    </div>
  </div>
  <div id="barre">
    <span id="etat"></span>
    <span id="btns">
      <button id="recentrer" type="button">Recentrer</button>
      <button id="vider" type="button">Recommencer</button>
    </span>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from './vrbutton.js';
import { materiau, cielEnv } from './textures.js';
import { DONNEES } from './donnees.js';

/* ===================== MODÈLE (identique à l'écran 2D du stand) ===================== */
const MA=-1.7826667, MB=4.1806667, MC=6.12, LAM0=0.35, LAMK=0.088, EAU_OPT=18;
const rc  = f => MA*f*f + MB*f + MC;
const lam = f => LAM0 - LAMK*f;
/* pénalité d'écart à la teneur en eau optimale — pédagogique, pas normative */
const penal = e => Math.max(0.25, 1 - Math.abs(e - EAU_OPT) / 22);

/* la cible issue de l'écran d'optimisation — lue par la fiche murale */
let critere = null, cible = null;

/* ===================== RENDU ===================== */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.94;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.environment = cielEnv(renderer, '#9CC4E4', '#E6EFF6', '#FFF6E2');
scene.background = new THREE.Color(0x0C0908);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.04, 60);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
/* Au casque, la hauteur du regard est la vraie : un enfant ou un visiteur
   assis voyait la façade du meuble au lieu du plan de travail. On recale donc
   le décor pour que les yeux soient à 1,50 m dans la scène, quelle que soit
   la taille du visiteur. La gâchette latérale (grip) refait le calage. */
let rigY = 0;
rig.position.set(0, rigY, 0.34);
camera.position.set(0, 1.50, 0);          /* debout devant le plan de travail */

/* ===================== LUMIÈRE : jour froid + suspension chaude ===================== */
const jour = new THREE.DirectionalLight(0xFFE9C6, 0.95);
jour.position.set(4.6, 3.4, 2.2);
jour.target.position.set(0, 0.9, -0.4);
jour.castShadow = true;
jour.shadow.mapSize.set(1024,1024);
jour.shadow.camera.near=0.5; jour.shadow.camera.far=14;
jour.shadow.camera.left=-3.5; jour.shadow.camera.right=3.5;
jour.shadow.camera.top=3; jour.shadow.camera.bottom=-2;
jour.shadow.bias=-0.0011; jour.shadow.normalBias=0.018;
scene.add(jour, jour.target);

const SUSP_I = 2.5;                                  /* la lampe est chaude : le contraste fait la scène */
const suspension = new THREE.PointLight(0xFFB870, SUSP_I, 7, 2);
suspension.position.set(0, 1.92, -0.15);
suspension.castShadow = true;
suspension.shadow.mapSize.set(512,512);
suspension.shadow.bias = -0.004;
scene.add(suspension);

scene.add(new THREE.HemisphereLight(0xE7EFF7, 0x6A5034, 0.30));

/* ===================== MATIÈRES ===================== */
const mBois   = materiau({ base:[146,104,62], mottle:0.24, grain:0.10, micro:0.03, planches:true,
                           roughBase:0.45, roughVar:0.18, relief:6, scale:11, seed:5, repeat:[2,1], normalScale:0.55 });
/* Faïence : moins de relief fin et une surface moins vernie. Au casque, le
   relief à haute fréquence accrochait des reflets ponctuels qui scintillaient
   à chaque mouvement de tête (les petits points roses des photos). */
const mFaience= materiau({ base:[226,220,206], carrelage:6, mottle:0.12, grain:0.02, micro:0.004,
                           roughBase:0.48, roughVar:0.14, relief:9, scale:6, seed:31, repeat:[4,1], normalScale:0.35 });
const mMur    = materiau({ base:[214,201,180], mottle:0.07, grain:0.025, micro:0.006,
                           roughBase:0.95, roughVar:0.05, relief:5, scale:7, seed:47, repeat:[2,1.4], normalScale:0.3 });
const mSolTom = materiau({ base:[172,104,72], carrelage:5, mottle:0.22, grain:0.05, micro:0.03,
                           roughBase:0.42, roughVar:0.26, relief:16, scale:6, seed:19, repeat:[3,3], normalScale:0.8 });
const mMeuble = materiau({ base:[74,86,80], mottle:0.05, grain:0.03, micro:0.02,
                           roughBase:0.50, roughVar:0.10, relief:4, scale:6, seed:71, repeat:[1,1], normalScale:0.4 });
const mLaiton = new THREE.MeshStandardMaterial({ color:0xB9873F, roughness:0.28, metalness:0.9 });
const mInox   = new THREE.MeshStandardMaterial({ color:0xBFC3C6, roughness:0.32, metalness:0.85 });
const mVerre  = new THREE.MeshPhysicalMaterial({ color:0xE4F0F4, roughness:0.05, metalness:0,
                  transparent:true, opacity:0.30, ior:1.5, envMapIntensity:2.6,
                  clearcoat:1, clearcoatRoughness:0.04, side:THREE.DoubleSide });
const mVerreVif = new THREE.MeshPhysicalMaterial({ color:0xF2FAFC, roughness:0.04, metalness:0,
                  transparent:true, opacity:0.62, ior:1.5, envMapIntensity:3.0,
                  clearcoat:1, clearcoatRoughness:0.03 });

function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||scene).add(m); return m;
}

/* ===================== LA CUISINE ===================== */
const PY = 0.94;                                   /* hauteur du plan de travail */
box(6.0,0.10,5.0,mSolTom,0,-0.05,-0.6).castShadow=false;
box(6.0,0.10,5.0,mMur,0,2.55,-0.6).castShadow=false;
box(6.0,2.6,0.12,mMur,0,1.3,-3.06);                /* mur du fond */
box(0.12,2.6,5.0,mMur,-3.0,1.3,-0.6);

/* meuble bas + plan de travail */
box(4.4,PY-0.08,0.82,mMeuble,0,(PY-0.08)/2,-0.70);
box(4.6,0.08,0.88,mBois,0,PY-0.04,-0.70);
/* crédence */
box(4.6,0.92,0.04,mFaience,0,PY+0.46,-1.06);
/* étagère + bocaux de réserve */
box(3.0,0.05,0.26,mBois,0,PY+1.30,-0.96);

/* ----------------------------------------------------------------------------
   LA FENÊTRE
   Le mur de droite est monté en quatre morceaux autour de la baie : une vraie
   ouverture, avec sa profondeur d'embrasure, son dormant, son vitrage et un
   paysage derrière. Le plan de paysage était auparavant noyé DANS l'épaisseur
   du mur — d'où la vitre laiteuse.
   ---------------------------------------------------------------------------- */
{
  const XM = 3.0, EP = 0.12;                       /* mur de droite, son épaisseur */
  const z0 = -1.35, z1 = 0.75;                     /* la baie, en z */
  const y0 = 1.02, y1 = 2.10;                      /* la baie, en y */
  const mur4 = (h, yc, d, zc) => box(EP, h, d, mMur, XM, yc, zc);
  mur4(y0, y0/2, 5.0, -0.6);                             /* allège, toute la longueur */
  mur4(2.6-y1, (2.6+y1)/2, 5.0, -0.6);                   /* imposte */
  mur4(y1-y0, (y0+y1)/2, Math.abs(-3.1-z0), (-3.1+z0)/2);/* trumeau arrière */
  mur4(y1-y0, (y0+y1)/2, Math.abs(z1-1.9), (z1+1.9)/2);  /* trumeau avant */

  /* le paysage, posé DEHORS, bien au-delà du mur */
  {
    const c=document.createElement('canvas'); c.width=1024; c.height=512;
    const g=c.getContext('2d');
    const ciel=g.createLinearGradient(0,0,0,300);
    ciel.addColorStop(0,'#6FA8DC'); ciel.addColorStop(0.55,'#A8CDE8'); ciel.addColorStop(1,'#DCEAF3');
    g.fillStyle=ciel; g.fillRect(0,0,1024,310);
    /* nuages */
    g.fillStyle='rgba(255,255,255,.78)';
    for (const [x,y,r] of [[140,72,42],[196,66,52],[250,78,36],[660,54,38],[712,48,48],[764,60,32],[880,110,28],[920,104,36]]){
      g.beginPath(); g.ellipse(x,y,r,r*0.58,0,0,7); g.fill();
    }
    /* collines lointaines */
    g.fillStyle='#8FA9A0'; g.beginPath(); g.moveTo(0,312);
    for(let x=0;x<=1024;x+=16) g.lineTo(x, 312 - 34*Math.sin(x*0.0042) - 16*Math.sin(x*0.011+1.1));
    g.lineTo(1024,340); g.lineTo(0,340); g.fill();
    g.fillStyle='#7C9A79'; g.beginPath(); g.moveTo(0,338);
    for(let x=0;x<=1024;x+=14) g.lineTo(x, 338 - 22*Math.sin(x*0.0075+2.0));
    g.lineTo(1024,372); g.lineTo(0,372); g.fill();
    /* prairie */
    const pre=g.createLinearGradient(0,350,0,512);
    pre.addColorStop(0,'#7FA25E'); pre.addColorStop(1,'#5E7F45');
    g.fillStyle=pre; g.fillRect(0,352,1024,160);
    /* haie et arbres */
    let gr2 = 7331; const rnd=()=>(gr2=(gr2*1103515245+12345)&0x7fffffff)/0x7fffffff;
    for (let i=0;i<26;i++){
      const x=rnd()*1024, h=26+rnd()*46, y=364+rnd()*44;
      g.fillStyle='#4F6B3E'; g.beginPath(); g.ellipse(x,y-h*0.55,h*0.40,h*0.52,0,0,7); g.fill();
      g.fillStyle='#5A4632'; g.fillRect(x-2.5,y-h*0.22,5,h*0.26);
    }
    /* un muret de terre au premier plan : on voit d'où vient la matière */
    g.fillStyle='#A9784E'; g.fillRect(0,452,1024,26);
    g.strokeStyle='rgba(120,82,52,.55)'; g.lineWidth=2;
    for(let x=0;x<1024;x+=54){ g.beginPath(); g.moveTo(x,452); g.lineTo(x,478); g.stroke(); }
    g.beginPath(); g.moveTo(0,465); g.lineTo(1024,465); g.stroke();
    g.fillStyle='#6E8F52'; g.fillRect(0,478,1024,34);
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
    const v=new THREE.Mesh(new THREE.PlaneGeometry(7.2,3.6), new THREE.MeshBasicMaterial({map:t,toneMapped:false}));
    v.position.set(5.6, 1.85, -0.30); v.rotation.y=-Math.PI/2; scene.add(v);
  }

  /* embrasure : le mur a une épaisseur, ça se voit */
  const emb = new THREE.MeshStandardMaterial({ color:0xE6DCC8, roughness:0.92 });
  box(EP, 0.035, z1-z0, emb, XM, y0+0.015, (z0+z1)/2);
  box(EP, 0.035, z1-z0, emb, XM, y1-0.015, (z0+z1)/2);
  for (const zz of [z0, z1]) box(EP, y1-y0, 0.035, emb, XM, (y0+y1)/2, zz);
  /* appui intérieur, en bois */
  box(0.20, 0.035, z1-z0+0.10, mBois, XM-0.155, y0-0.005, (z0+z1)/2);

  /* dormant, meneau et vitrage */
  const mDorm = new THREE.MeshStandardMaterial({ color:0x8E6A44, roughness:0.55 });
  const zc = (z0+z1)/2, yc = (y0+y1)/2, LZ = z1-z0, LY = y1-y0;
  box(0.07, 0.06, LZ, mDorm, XM-0.03, y0+0.03, zc);
  box(0.07, 0.06, LZ, mDorm, XM-0.03, y1-0.03, zc);
  for (const zz of [z0+0.03, zc, z1-0.03]) box(0.07, LY, 0.06, mDorm, XM-0.03, yc, zz);
  box(0.07, 0.035, LZ, mDorm, XM-0.03, yc, zc);          /* traverse */
  const vitre = new THREE.Mesh(new THREE.PlaneGeometry(LZ-0.10, LY-0.10),
    new THREE.MeshPhysicalMaterial({ color:0xDCEBF2, roughness:0.04, metalness:0,
      transparent:true, opacity:0.16, ior:1.52, envMapIntensity:2.4, side:THREE.DoubleSide }));
  vitre.position.set(XM-0.055, yc, zc); vitre.rotation.y = -Math.PI/2; scene.add(vitre);

  /* la lumière qui entre par là */
  const jourFenetre = new THREE.DirectionalLight(0xD8E6FF, 1.0);   /* le jour qui entre est froid, bleuté */
  jourFenetre.position.set(6.2, 3.0, 0.6);
  jourFenetre.target.position.set(0.2, 1.0, -0.6);
  scene.add(jourFenetre, jourFenetre.target);
}

/* suspension au-dessus du plan */
{
  box(0.03,0.62,0.03,mLaiton,0,2.24,-0.15);

/* Le bocal ne bouge pas : c'est le NIVEAU à l'intérieur qui descend.
   Pour qu'on le voie, le verre est dessiné comme du verre — un bourrelet en
   haut, un cerclage laiton, un liseré vertical — et la matière porte une
   surface plane bien nette, qui glisse le long de la paroi. */
function bocal(nom, sous, x, couleur, niveau, z, y){
  const g = new THREE.Group(); g.position.set(x, y, z); gMiseEnPlace.add(g);
  const R=0.068, H=0.20;
  const verre=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,26,1,true), mVerre);
  verre.position.y=H/2; g.add(verre);
  const fond=new THREE.Mesh(new THREE.CylinderGeometry(R,R,0.012,26), mVerre);
  fond.position.y=0.006; g.add(fond);
  /* Bocal à conserve, côtelé : les nervures dessinent toute la hauteur du
     verre, pleine ou vide. Sans elles, un bocal presque vide se lit comme
     un bocal plus petit — c'est le piège de ce genre de scène. */
  for (const [yy, rr2] of [[0.014,0.0065],[H*0.28,0.0055],[H*0.50,0.0055],[H*0.72,0.0055],[H-0.012,0.0080]]){
    const n=new THREE.Mesh(new THREE.TorusGeometry(R*0.995, rr2, 8, 26), mVerreVif);
    n.rotation.x=Math.PI/2; n.position.y=yy; g.add(n);
  }
  /* liseré vertical sur toute la hauteur, pour tenir la silhouette */
  for (const a of [-0.62, 0.62]){
    const ar=new THREE.Mesh(new THREE.BoxGeometry(0.006, H-0.02, 0.006), mVerreVif);
    ar.position.set(Math.sin(a)*R*0.99, H/2, Math.cos(a)*R*0.99); g.add(ar);
  }
  const couv=new THREE.Mesh(new THREE.CylinderGeometry(R*1.06,R*1.06,0.035,26), mLaiton);
  couv.position.y=H+0.017; couv.castShadow=true; g.add(couv);
  /* le reflet vertical : c'est lui qui dit « c'est du verre » */
  const reflet=new THREE.Mesh(new THREE.PlaneGeometry(0.013,H*0.82),
    new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:0.20,
                                 toneMapped:false, depthWrite:false}));
  reflet.position.set(-R*0.44, H*0.50, R*0.90); reflet.rotation.y=0.42; g.add(reflet);

  const mCont = new THREE.MeshStandardMaterial({color:couleur, roughness:0.95});
  const cont=new THREE.Mesh(new THREE.CylinderGeometry(R*0.955,R*0.955,1,22), mCont);
  cont.castShadow=true; g.add(cont);
  /* la surface de la matière : un disque net, un peu plus clair */
  const dessus=new THREE.Mesh(new THREE.CircleGeometry(R*0.955,22),
    new THREE.MeshStandardMaterial({color:couleur, roughness:0.88}));
  dessus.material.color.offsetHSL(0,0,0.06);
  dessus.rotation.x=-Math.PI/2; g.add(dessus);

  const et=new THREE.Mesh(new THREE.PlaneGeometry(0.118,0.055),
    new THREE.MeshBasicMaterial({map:etiquette(nom,sous), toneMapped:false}));
  et.position.set(0,H*0.50,R+0.002); g.add(et);
  g.userData={cont,dessus,H};
  bocaux[nom]=g;
  return g;
}

const cadranBal = fiche(0.128, 0.128, {m:0, cible:null}, (g,W,H,d)=>{
  const cx=W/2, cy=H/2, R=W*0.455;
  g.fillStyle='#F4EFE2'; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
  g.strokeStyle='#8A8276'; g.lineWidth=W*0.035; g.beginPath(); g.arc(cx,cy,R-W*0.018,0,7); g.stroke();
  const A0 = Math.PI*0.75, A1 = Math.PI*2.25, MAXG = 1600;
  /* graduations tous les 200 g */
  for (let v=0; v<=MAXG; v+=100){
    const a = A0 + (A1-A0)*v/MAXG, gros = (v % 400 === 0);
    const r0 = R*(gros?0.70:0.79), r1 = R*0.88;
    g.strokeStyle = gros ? '#2A241C' : '#8A8276'; g.lineWidth = gros ? W*0.016 : W*0.008;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    g.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); g.stroke();
    if (gros){
      g.fillStyle='#4A4034'; g.font='bold '+Math.round(W*0.075)+'px Segoe UI, sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(String(v/1000).replace('.',','), cx+Math.cos(a)*R*0.58, cy+Math.sin(a)*R*0.58);
    }
  }
  g.fillStyle='#7A6A55'; g.font=Math.round(W*0.058)+'px Segoe UI, sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('kg', cx, cy - R*0.40);
  /* l'aiguille */
  const m = Math.max(0, Math.min(MAXG, d.m));
  const a = A0 + (A1-A0)*m/MAXG;
  g.strokeStyle='#9B2C1B'; g.lineWidth=W*0.026; g.lineCap='round';
  g.beginPath(); g.moveTo(cx-Math.cos(a)*R*0.12, cy-Math.sin(a)*R*0.12);

  g.fillText(txt, cx, cy + R*0.30 + lh/2);
}, 900);

/* ===================== FICHE RECETTE FLOTTANTE ===================== */
function fiche(w,h,etat,draw,S){
  S = S || 420; const c=document.createElement('canvas');
  c.width=Math.round(w*S); c.height=Math.round(h*S);
  const g=c.getContext('2d');
  const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,toneMapped:false}));
  m.userData=etat;
  m.userData.redraw=()=>{ g.clearRect(0,0,c.width,c.height); draw(g,c.width,c.height,m.userData); t.needsUpdate=true; };
  m.userData.redraw(); return m;
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

   n'a pas encore fourni s'affiche « donnée à venir », et la source, quand elle
   existe, est imprimée sous le tableau. */

const f1 = v => v.toFixed(1).replace('.',',');
const f2 = v => v.toFixed(2).replace('.',',');
/* le signe moins typographique (−2 °C, pas -2 °C), et pas de « −0,0 » */
const moins = v => { const t = String(v); return /^-0(,0+)?$/.test(t) ? t.slice(1) : t.replace(/^-/, '\u2212'); };
function valeur(v, unite){
  const x = rien(v); return x === null ? 'donnée à venir' : (x + (unite ? ' ' + unite : ''));
}

/* découpe un texte en lignes qui tiennent dans la largeur donnée */
function lignes(g, txt, max){
  const mots = String(txt).split(' '); const out=[]; let l='';
  for (const m of mots){ const t = l ? l+' '+m : m;
    if (g.measureText(t).width > max && l){ out.push(l); l=m; } else l=t; }
  if (l) out.push(l); return out;
}
/* ============================================================================
   LE PANNEAU DE RÉCIT, AU CASQUE
   L'ancienne version était un bandeau collé au regard : où qu'on regarde, il
   était 19° plus bas, toujours opaque — donc il cachait en permanence ce qu'on
   regardait, et son texte était coupé faute de hauteur. Celui-ci :
     · APPARAÎT quand il y a quelque chose de nouveau à lire, le temps de le
       lire (de 4 à 12 s selon la longueur), puis S'EFFACE complètement ;
     · REVIENT de lui-même si le visiteur reste 14 s sans agir alors qu'on
       attend un geste de lui — le chef qui rappelle la consigne ;
     · s'efface dès qu'on agit (verser, mélanger…) ;
     · suit la tête PARESSEUSEMENT : il ne bouge que si l'on tourne de plus de
       12°, et il glisse alors en douceur — c'est ce que recommande Meta pour
       l'interface en VR, plutôt qu'un panneau rivé au regard ;
     · prend la hauteur de son texte : plus rien n'est coupé ;
     · est dessiné à 960 px/m, deux fois plus fin : il était flou au casque.
   À l'écran plat, c'est toujours le bandeau HTML du bas qui parle.
   ============================================================================ */
const PANNEAU_TEST = /[?&]panneau\b/.test(location.search);   /* le voir sans casque */
/* plus étroit qu'avant (0,60 m) : il gênait la vue */
const RECIT_W = 0.46, RECIT_PXM = 1252, RECIT_D = 1.10;
const recitCv = document.createElement('canvas');
recitCv.width = Math.round(RECIT_W * RECIT_PXM);                /* 576 px */
recitCv.height = 512;                                          /* hauteur maximale */
const recitG = recitCv.getContext('2d');
const recitTex = new THREE.CanvasTexture(recitCv);
recitTex.colorSpace = THREE.SRGBColorSpace; recitTex.anisotropy = 8;
const consigne = new THREE.Mesh(
  new THREE.PlaneGeometry(RECIT_W, recitCv.height / RECIT_PXM),
  new THREE.MeshBasicMaterial({ map: recitTex, transparent: true, opacity: 0,
                                depthWrite: false, depthTest: false, toneMapped: false }));
consigne.renderOrder = 10;
consigne.visible = false;
consigne.userData = { txt:'', faire:'', cle:'' };
consigne.userData.redraw = () => {
  const d = consigne.userData, g = recitG, W = recitCv.width, H = recitCv.height;
  const PAD = 30, LW = W - 2*PAD;
  g.font = 'italic 31px Georgia, serif';
  const lt = d.txt ? lignes(g, d.txt, LW) : [];
  g.font = 'bold 29px Segoe UI, sans-serif';
  const lf = d.faire ? lignes(g, d.faire, LW) : [];
  const haut = Math.min(H, 26 + lt.length*40 + (lf.length ? (lt.length ? 22 : 0) + lf.length*38 : 0) + 22);
  g.clearRect(0, 0, W, H);
  if (lt.length || lf.length){
    /* un voile léger plutôt qu'un pavé noir : on voit la scène à travers,
       et un liseré sombre autour des lettres garde la lecture */
    g.fillStyle = 'rgba(16,12,10,.52)'; rr(g, 0, 0, W, haut, 22); g.fill();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,.95)'; g.shadowBlur = 8;
    let y = 26 + 20;
    g.fillStyle = '#E7DCC6'; g.font = 'italic 31px Georgia, serif';
    for (const l of lt){ g.fillText(l, W/2, y); y += 40; }
    if (lf.length){
      if (lt.length){
        y += 2;
        g.strokeStyle = 'rgba(246,240,228,.22)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(52, y-20); g.lineTo(W-52, y-20); g.stroke();
        y += 20;
      }
      g.fillStyle = '#F2C185'; g.font = 'bold 29px Segoe UI, sans-serif';
      for (const l of lf){ g.fillText(l, W/2, y); y += 38; }
    }
    g.shadowBlur = 0;
  }
  /* on ne montre que la partie utile du canevas, et le panneau prend sa taille */
  const f = Math.max(0.05, haut / H);
  consigne.scale.y = f;
  recitTex.repeat.set(1, f); recitTex.offset.set(0, 1 - f);
  recitTex.needsUpdate = true;
  /* un texte nouveau : on le montre */
  const cle = (d.txt||'') + '|' + (d.faire||'');
  if (cle !== d.cle){ d.cle = cle; if (typeof recitMontrer === 'function') recitMontrer(); }
};

/* ---- la petite mécanique d'apparition ---- */
const recit = { t0: -1e9, duree: 0, derniereAct: 0, yaw: 0, pitch: 0, suivre: false, tPrec: 0,
                rappels: 0, coupe: false };
/* plus bref qu'avant (4 à 12 s) : le temps de lire, pas plus */
function recitMontrer(rappel){
  const n = (consigne.userData.txt||'').length + (consigne.userData.faire||'').length;
  recit.t0 = performance.now();
  recit.duree = Math.max(3, Math.min(8, 1.8 + 0.045*n));
  if (!rappel) recit.rappels = 0;
}
/* les moments où l'on attend un geste du visiteur : seuls ceux-là méritent un rappel */
function attenteAction(){
  return phase === 'ecran' || phase === 'cuisine' || phase === 'choix' || phase === 'bilan'
      || phase === 'dedans' || phase === 'hiver'
      || (phase === 'mur' && typeof clefEnAttente !== 'undefined' && clefEnAttente);
}
const _tete = new THREE.Vector3(), _regard = new THREE.Vector3();
const ecartAngle = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; };
function animRecit(){
  if (!(renderer.xr.isPresenting || PANNEAU_TEST)){ consigne.visible = false; return; }
  const now = performance.now();
  /* au temps réel, comme tout le récit : une machine lente ne doit pas
     laisser traîner le panneau à l'écran */
  const dt = Math.min(0.5, Math.max(0, (now - (recit.tPrec || now)) / 1000));
  recit.tPrec = now;
  const occupe = !!geste || !!mainsGeste[0] || !!mainsGeste[1];
  if (occupe) recit.derniereAct = now;
  const vide = !consigne.userData.txt && !consigne.userData.faire;
  let cible = 0;
  if (!vide && !occupe && !recit.coupe){
    const fin = recit.t0 + recit.duree*1000;
    if (now < fin) cible = 1;
    /* un seul rappel, au bout de 30 s sans geste — plus de retour toutes les 14 s */
    else if (attenteAction() && recit.rappels < 1 && now - Math.max(fin, recit.derniereAct) > 30000){
      recit.rappels++; recitMontrer(true); cible = 1; }
  }
  const o = consigne.material.opacity;
  consigne.material.opacity = o + (cible - o) * (1 - Math.exp(-dt * (cible > o ? 8 : 3.5)));
  consigne.visible = consigne.material.opacity > 0.01;

  /* le suivi paresseux : 26° sous le regard (avant : 17°), en bas du champ,
     comme un sous-titre — il ne se met plus devant ce qu'on regarde */
  camera.getWorldPosition(_tete); camera.getWorldDirection(_regard);
  const yv = Math.atan2(_regard.x, _regard.z);
  const pv = Math.max(-1.15, Math.min(0.10, Math.asin(Math.max(-1, Math.min(1, _regard.y))) - 0.45));
  if (consigne.material.opacity < 0.03){ recit.yaw = yv; recit.pitch = pv; recit.suivre = false; }
  else {
    const dy = ecartAngle(yv, recit.yaw), dp = pv - recit.pitch, dd = Math.hypot(dy, dp);
    if (dd > 0.21) recit.suivre = true;
    if (recit.suivre){
      const k = Math.min(1, dt*3.2);
      recit.yaw += dy*k; recit.pitch += dp*k;
      if (dd < 0.03) recit.suivre = false;
    }
  }
  const cp = Math.cos(recit.pitch);
  consigne.position.set(_tete.x + Math.sin(recit.yaw)*cp*RECIT_D,
                        _tete.y + Math.sin(recit.pitch)*RECIT_D,
                        _tete.z + Math.cos(recit.yaw)*cp*RECIT_D);
  consigne.lookAt(_tete);
}

/* ===================== SON : tout est synthétisé, aucun fichier ===================== */
let AC=null, bruit=null, busSortie=null;
function audioDemarre(){
  if(AC){ if (AC.state === 'suspended') AC.resume(); return; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  busSortie = AC.createGain(); busSortie.gain.value = 1; busSortie.connect(AC.destination);
  const n = AC.sampleRate*2, buf = AC.createBuffer(1,n,AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  bruit = buf;
}
function source(){ const s=AC.createBufferSource(); s.buffer=bruit; s.loop=true; return s; }
let flot=null;
function sonVerser(on, aigu, pos){
  if(!AC) return;
  if(on && !flot){
    const s=source(), f=AC.createBiquadFilter(), g=AC.createGain();
    f.type='bandpass'; f.frequency.value= aigu? 2400 : 900; f.Q.value=0.8;
    g.gain.value=0; s.connect(f); f.connect(g); g.connect(sortieAudio(pos)); s.start();
    g.gain.linearRampToValueAtTime(0.13, AC.currentTime+0.12);
    flot={s,g,f,base:(aigu?2400:900)};
  } else if(!on && flot){
    flot.g.gain.linearRampToValueAtTime(0, AC.currentTime+0.15);
    const f=flot; setTimeout(()=>{ try{f.s.stop();}catch(e){} },260); flot=null;
  }
}
/* le filet monte dans les aigus à mesure que le saladier se remplit —
   c'est ce que fait un vrai récipient qu'on remplit. */
function sonVerserHauteur(t){
  if (flot && flot.f) flot.f.frequency.setTargetAtTime(flot.base*(1 + 0.55*t), AC.currentTime, 0.12);
}
/* le crachotement d'une imprimante de comptoir */
function sonImprimante(){
  if(!AC){ audioDemarre(); if(!AC) return; }
  for (let i=0;i<9;i++) setTimeout(()=>sonCourt(180 + (i%3)*60, 0.035, 'square', ECRAN_A), i*70);
}
/* le « tac » sec d'une terre qui se fend */
function sonFissure(){
  if(!AC){ audioDemarre(); if(!AC) return; }
  const s2=source(), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='highpass'; f.frequency.value=1800;
  g.gain.setValueAtTime(0.30, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.14);
  s2.connect(f); f.connect(g); g.connect(busSortie);
  s2.start(); s2.stop(AC.currentTime+0.16);
  sonCourt(1200, 0.05, 'square');
}
function sonCourt(freq, duree, type, pos){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.5, AC.currentTime+duree);
  g.gain.setValueAtTime(0.22, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+duree);
  o.connect(g); g.connect(sortieAudio(pos, duree+0.3)); o.start(); o.stop(AC.currentTime+duree+0.02);
}
let remue=null;
function sonRemuer(on){
  if(!AC) return;
  if(on && !remue){
    const s=source(), f=AC.createBiquadFilter(), g=AC.createGain();
    f.type='lowpass'; f.frequency.value=520;
    g.gain.value=0.10; s.connect(f); f.connect(g); g.connect(sortieAudio(saladier.position)); s.start();
    remue={s,g};
  } else if(!on && remue){
    remue.g.gain.linearRampToValueAtTime(0, AC.currentTime+0.12);
    const r=remue; setTimeout(()=>{ try{r.s.stop();}catch(e){} },200); remue=null;
  }
}

/* on retient le dernier impact : il donne la longueur du rayon et la place du réticule */
{ const io = rayon.intersectObject.bind(rayon), ios = rayon.intersectObjects.bind(rayon);
  rayon.intersectObject  = (o, r, t) => { const h = io(o, r, t);  if (h[0]) rayon.dernier = h[0]; return h; };
  rayon.intersectObjects = (o, r, t) => { const h = ios(o, r, t); if (h[0]) rayon.dernier = h[0]; return h; }; }

function viser(x,y){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((x-r.left)/r.width)*2-1; ptr.y = -((y-r.top)/r.height)*2+1;
  rayon.setFromCamera(ptr, camera);
  return cibleDuRayon();
}
function cibleDuRayon(){
  if (typeof phase !== 'undefined' && phase === 'choix'){
    if (rayon.intersectObject(zFour ,false)[0]) return { quoi:'four'  };
    if (rayon.intersectObject(zClaie,false)[0]) return { quoi:'claie' };
    return null;
  }
  if (typeof phase !== 'undefined' && phase === 'ecran'){
    for (const k in zCrit) if (rayon.intersectObject(zCrit[k],false)[0]) return { quoi:'crit', nom:k };
    return null;
  }
  if (typeof phase !== 'undefined' && phase === 'hiver'){
    for (const k in zoneMur)  if (rayon.intersectObject(zoneMur[k],false)[0])  return { quoi:'mur6', nom:k };
    for (const c in zoneCons) if (rayon.intersectObject(zoneCons[c],false)[0]) return { quoi:'cons6', nom:+c };
    if (rayon.intersectObject(zoneCam ,false)[0]) return { quoi:'cam6' };
    if (rayon.intersectObject(zoneFin6,false)[0]) return { quoi:'fin6' };
    return null;
  }
  if (typeof phase !== 'undefined' && phase === 'mur'){
    if (zoneClef.visible && rayon.intersectObject(zoneClef,false)[0]) return { quoi:'clef' };
    return null;
  }
  if (typeof phase !== 'undefined' && phase === 'dedans'){
    if (rayon.intersectObject(zTerre,false)[0]) return { quoi:'sol', nom:'terre' };
    if (rayon.intersectObject(zConv ,false)[0]) return { quoi:'sol', nom:'conventionnel' };
    if (zFin.visible && rayon.intersectObject(zFin,false)[0]) return { quoi:'fin' };
    const hm = rayon.intersectObject(zoneMurInt,false)[0];
    if (hm) return { quoi:'toucher', p:hm.point.clone() };
    return null;
  }
  if (typeof phase !== 'undefined' && phase !== 'cuisine') return null;
  const b = rayon.intersectObjects(cibles,false)[0];
  if (b) return { quoi:'bocal', nom:b.object.userData.bocal };
  if (rayon.intersectObject(zoneMoule,false)[0]) return { quoi:'moule' };
  if (rayon.intersectObject(zoneBol,false)[0])   return { quoi:'bol' };
  return null;
}

/* ---- filet qui coule ---- */
const flux = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.020,1,8,1,true),
  new THREE.MeshBasicMaterial({transparent:true, opacity:0.9, toneMapped:false, side:THREE.DoubleSide}));
flux.visible=false; scene.add(flux);

let verseEnCours = null;       /* { nom, b, base } tant que le doigt reste appuyé */
function debutVersement(nom){
  if (dansMoule) return;
  const b = bocaux[nom];
  /* on mémorise la hauteur propre du bocal : les deux du fond sont posés
     sur un tasseau, les remettre à la hauteur du plan les ferait plonger. */
  verseEnCours = { nom, b, base:b.rotation.z, baseY:b.position.y, t:performance.now() };
  flux.material.color.setHex(TEINTE[nom]);
  audioDemarre(); sonVerser(true, nom==='EAU', saladier.position);
}
function finVersement(){
  if(!verseEnCours) return;
  verseEnCours.b.rotation.z = verseEnCours.base;
  verseEnCours.b.position.y = verseEnCours.baseY;
  verseEnCours = null; flux.visible=false;
  sonVerser(false); sonCourt(180, 0.10, 'sine');
  melange = Math.max(0, melange - 0.35);      /* on vient d'ajouter : il faut re-mélanger */
  maj();
}
function animVersement(dt){
  if(!verseEnCours){ flux.visible=false; return; }
  const v = verseEnCours;
  v.b.rotation.z = v.base - 1.0;
  v.b.position.y = v.baseY + 0.05;
  /* on compte le temps réel écoulé, pas la cadence d'affichage : le débit reste
     le même sur un téléphone lent et sur le casque */
  const now = performance.now();
  const dtv = Math.min((now - v.t)/1000, 0.40); v.t = now;
  CONT[v.nom] = Math.min(CONT[v.nom] + DEBIT[v.nom]*dtv, 2000);
  sonVerserHauteur(Math.min(1, (solides() + CONT.EAU)/MASSE_CIBLE));
  const o = v.b.position.clone().setY(v.baseY + 0.19);
  const d = saladier.position.clone().setY(PY + RBOL*0.55);
  flux.visible = true;
  flux.position.copy(o.clone().lerp(d,0.5));
  flux.scale.y = o.distanceTo(d);
  flux.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().sub(o).normalize());
  maj();
}

function remuer(dt){

  audioDemarre(); sonImpact(moule.position, 420); sonCourt(120, 0.22, 'triangle', moule.position);
  setTimeout(()=>{ for(const w of parois) w.visible=false; sonCourt(210,0.16,'sine', moule.position); }, 700);
  maj();

}
function viderSaladier(){

/* ===================== ÉTAT DE LA PÂTE ===================== */
function eauPct(){ return pct(CONT.EAU); }
function consistanceOk(){ const e=eauPct(); return e>=13 && e<=24; }
function consistanceTexte(){
  if (solides() < 200) return 'Le saladier est vide';
  const e = eauPct();
  if (e < 8)  return 'Poudre sèche — il manque l’eau';
  if (e < 13) return 'Trop sèche — elle s’effrite';
  if (e > 24) return 'Trop d’eau — elle colle';
  if (melange < 0.75) return 'À mélanger';
  if (dansMoule)      return 'Démoulée — reste à sécher';
  return 'Prête à mouler';
}

/* Ce que donnera la brique — borné au domaine réellement mesuré au laboratoire.
   La même loi que l'écran 2D du stand, aux mêmes coefficients. */
function resume(){
  const sol = solides(), pF = pct(CONT.FIBRES), pE = eauPct();
  if (sol < 200) return '—';
  if (pF > 2.5)  return 'hors du domaine mesuré';
  const r = rc(pF)*penal(pE), l = lam(pF);
  return r.toFixed(2).replace('.',',')+' MPa  ·  '+l.toFixed(2).replace('.',',')+' W/m·K';
}

/* Ce qu'il faut faire maintenant — la phrase change à chaque geste,
   c'est elle qui tient le visiteur par la main. */
function instruction(){
  const sol = solides(), e = eauPct();
  if (dansMoule)          return 'Votre briquette est démoulée. Reste la vraie question&nbsp;: <b>faut-il la cuire&nbsp;?</b>';
  if (sol < 200)          return '<b>Maintenez le doigt sur un bocal</b> — il se penche et verse. Commencez par la terre.';
  if (CONT.EAU < 20)      return 'De la terre, du sable, une pincée de fibres. Puis <b>l’eau</b>&nbsp;: c’est elle qui décide de tout.';
  if (e > 24)             return 'Elle colle aux doigts&nbsp;: <b>trop d’eau</b>. Remettez de la terre.';
  if (e < 13)             return 'Elle s’effrite&nbsp;: <b>pas assez d’eau</b>. Versez-en un peu.';
  if (melange < 0.75)     return '<b>Frottez le saladier</b> du doigt, d’un bord à l’autre, jusqu’à ce que la pâte soit homogène.';
  return 'La pâte est prête. <b>Touchez le moule</b>, à votre gauche.';
}

/* ===================== AFFICHAGE ===================== */
function maj(){
  const sol = solides(), tot = sol + CONT.EAU;
  const pT=pct(CONT.TERRE), pS=pct(CONT.SABLE), pF=pct(CONT.FIBRES), pE=eauPct();

  /* niveaux dans les bocaux : ils se vident */
  niveau('TERRE',  Math.max(0.05, 1 - CONT.TERRE/1600));
  niveau('SABLE',  Math.max(0.05, 1 - CONT.SABLE/1200));
  niveau('FIBRES', Math.max(0.05, 1 - CONT.FIBRES/90));
  niveau('EAU',    Math.max(0.05, 1 - CONT.EAU/700));

  /* la pâte grossit dans le saladier — et elle SE COMPORTE :
     au-delà de 24 % d'eau elle s'affaisse et s'étale, en dessous de 13 %
     elle se rompt en miettes. La consistance n'est plus une phrase. */
  const remp = Math.min(1, tot / MASSE_CIBLE);
  pate.visible = remp > 0.01 && !dansMoule;
  const hum = Math.min(1, pE/26);
  const trempe = Math.max(0, Math.min(1, (pE - 24)/6));      /* 0 à 24 %, 1 à 30 % */
  const seche  = Math.max(0, Math.min(1, (13 - pE)/5));      /* 0 à 13 %, 1 à 8 %  */
  const etal = 1 + hum*0.13 + (1-melange)*0.03 + trempe*0.26;
  pate.scale.set(remp*etal, remp*(0.42 + (1-hum)*0.38)*(1 - trempe*0.34), remp*etal);
  pate.position.y = -0.090 + remp*0.008 - trempe*0.006;
  /* les miettes n'existent que sur une pâte trop sèche */
  gMiettes.visible = (seche > 0.05) && pate.visible;
  gMiettes.userData.f = seche;
  for (const m of miettes) m.scale.setScalar(Math.max(0.001, seche));
  const col = new THREE.Color().setHSL(
      0.078 - pF*0.010 - hum*0.004,
      0.50 - hum*0.09 - (1-melange)*0.05,
      0.098 + hum*0.048 + (pS/40)*0.028 + (1-melange)*0.018);
  pate.material.color.copy(col);
  pate.material.roughness = 1 - hum*0.5;

  /* la briquette n'apparaît qu'une fois moulée */
  briquette.visible = dansMoule;
  briquette.material.color.copy(col).offsetHSL(0,0,-0.02);

  /* le cadran de la balance suit la masse totale */
  if (cadranBal.userData.m !== tot){ cadranBal.userData.m = tot; cadranBal.userData.redraw(); }

  /* fiche au mur */
  const g = v => v<10 ? v.toFixed(1).replace('.',',')+' g' : Math.round(v)+' g';
  const p = v => sol>0 ? v.toFixed(1).replace('.',',')+' %' : '—';
  if (carte.userData.mode !== 'bilan') Object.assign(carte.userData, {
    mT:g(CONT.TERRE), pT:p(pT), mS:g(CONT.SABLE), pS:p(pS),

const taches = [];
/* on avance au temps réel, pas à la cadence d'affichage : le récit garde le
   même rythme sur un téléphone lent et dans le casque. */
function tache(duree, pas, fin){ taches.push({t0:performance.now(), d:Math.max(0.001,duree), pas, fin}); }
function apres(delai, fn){ tache(delai, null, fn); }
function animTaches(){
  const now = performance.now();
  for (let i=taches.length-1; i>=0; i--){
    const T = taches[i];
    const u = Math.min(1, (now - T.t0)/1000/T.d);
    if (T.pas) T.pas(u);
    if (u >= 1){ taches.splice(i,1); if (T.fin) T.fin(); }
  }
}

const SM = DONNEES.sechageModes;
const RMOD = SM.retraitModele;

/* ============================================================================
   LE RETRAIT AU SÉCHAGE — ce que le visiteur a versé décide de ce qu'il verra.
   Modèle calé sur une mesure du laboratoire :
   Gharbage I., Benmahiddine F., Sebaibi N. (2024), « Analyse de l'influence de
   la teneur en eau et des agrégats végétaux sur le phénomène de retrait dans
   des blocs de terre crue », Academic Journal of Civil Engineering 42(1),
   98-106, DOI 10.26168/ajce.42.1.9.
   Rien n'est extrapolé en silence : hors du domaine 20-30 % d'eau, l'écran
   le dit.
   ============================================================================ */
const interp = (tab, x) => {
  if (x <= tab[0][0]) return tab[0][1];
  const n = tab.length;
  if (x >= tab[n-1][0]) return tab[n-1][1];
  for (let i=1; i<n; i++) if (x <= tab[i][0]){
    const [x0,y0] = tab[i-1], [x1,y1] = tab[i];
    return y0 + (y1-y0)*(x-x0)/(x1-x0);
  }
  return tab[n-1][1];
};
/* e : teneur en eau (%), f : dosage en fibres (%). Retours en % de retrait. */
function retraitCalc(e, f){
  if (!RMOD || !RMOD.actif){
    const r = SM.retraitIllustration;
    return { long:r, lat:r, e, f, hors:'illustration' };
  }
  if (e === null || e === undefined) e = RMOD.domaineEau[0];
  if (f === null || f === undefined) f = 0;
  const [[e0,r0],[e1,r1]] = RMOD.ancresLong;
  const pente = (r1 - r0)/(e1 - e0);
  const L = Math.max(0, r0 + pente*(e - e0));      /* droite des deux mesures */
  const long = L * interp(RMOD.facteurFibresLong, f);
  const lat  = L * RMOD.ratioLateral * interp(RMOD.facteurFibresLat, f);
  const hors = (e < RMOD.domaineEau[0]) ? 'bas'
             : (e > RMOD.domaineEau[1]) ? 'haut' : null;
  return { long, lat, e, f, hors };
}

/* la formulation réellement versée, figée au moment du démoulage */
let formulation   = { e:null, f:null };
let retraitVisiteur = retraitCalc(RMOD ? RMOD.domaineEau[0] : 20, 0);
let retraitTemoin   = retraitVisiteur;
let echelleRetrait = 1;
let ampli = 12;                          /* facteur d'amplification affiché */
const retraitApplique = new Map();       /* mesh -> { u, r } */

function calcAmpli(){
  const m = Math.max(retraitVisiteur.long, retraitVisiteur.lat,
                     retraitTemoin.long,  retraitTemoin.lat, 0.5);
  ampli = Math.max(4, Math.min(20, Math.round(45/m)));
  const b = S('rx20'); if (b) b.textContent = 'Amplifiée \u00d7' + ampli;
}
function fixerFormulation(){
  formulation     = { e: eauPct(), f: pct(CONT.FIBRES) };
  retraitVisiteur = retraitCalc(formulation.e, formulation.f);
  retraitTemoin   = retraitCalc(formulation.e, 0);
  calcAmpli();
}

/* u : avancement du séchage (0 humide, 1 sec). Retrait anisotrope : le long
   et le large n'ont pas la même valeur, c'est la mesure qui le dit. */
function appliquerRetrait(b, u, r){
  r = r || retraitVisiteur;
  retraitApplique.set(b, { u, r });
  const k  = (echelleRetrait === 1) ? 1 : ampli;
  const sx = Math.max(0.25, 1 - r.long/100 * u * k);
  const st = Math.max(0.25, 1 - r.lat /100 * u * k);
  b.scale.set(sx, st, st);
  const f = b.userData.fantome;
  if (f){
    f.scale.set(1/sx, 1/st, 1/st);
    f.material.opacity = 0.80 * Math.min(1, u*1.6);
  }
}
function rejouerEchelle(){
  for (const [b, e] of retraitApplique) appliquerRetrait(b, e.u, e.r);
  carte.userData.redraw();
}

function cuire(b){
  dire('Étuve à ' + SM.etuve.temperature + ' °C. Quelques heures, et de l’énergie.');
  dirFaire('L’eau part vite. <b>Le volume diminue&nbsp;: c’est le retrait au séchage.</b>');
  /* la porte s'ouvre, la brique entre */
  tache(0.6, u => { porte.rotation.x = -1.35*lisse(u); });
  apres(0.5, () => tache(0.8, u => {
    b.position.lerpVectors(POSE_FOUR, new THREE.Vector3(-0.212,PY+0.122,-0.775), lisse(u)); }));
  apres(1.4, () => tache(0.5, u => { porte.rotation.x = -1.35*(1-lisse(u)); }));
  /* la braise monte, puis retombe */
  apres(1.9, () => {

      b.material.color.setHSL(0.072, 0.40 - 0.11*u, 0.150 + 0.095*u);

    }, () => { mBraise.opacity = 0; feu.intensity = 0;

    });

}
function sortirDuFour(b){

    b.position.y += Math.sin(Math.PI*lisse(u))*0.10; }));
  apres(1.3, () => tache(0.5, u => { porte.rotation.x = -1.35*(1-lisse(u)); }));

function secher(b){

    appliquerRetrait(b, u);
  }, () => {
    tache(1.0, u => { soleil.intensity = 5.5*(1-lisse(u)); rai.material.opacity = 0.16*(1-lisse(u)); });
    tache(0.9, u => { b.position.lerpVectors(POSE_CLAIE, POSE_SEUL, lisse(u));
                      b.position.y += Math.sin(Math.PI*lisse(u))*0.09; },
      () => comparer());

/* ============================================================================
   LE TEMPS FORT DU RETRAIT — même eau, même séchage, une seule différence :
   les fibres. C'est le résultat de l'article : 4 % de paille de blé, et le
   retrait tombe de 70 % en long et de 100 % en large.
   ============================================================================ */
function beatRetrait(){
  const v = briqueSeche;
  /* votre brique se pousse à gauche pour laisser la place au témoin */
  const dep = v.position.clone();
  tache(0.9, u => { v.position.lerpVectors(dep, FIN_G, lisse(u)); });

  /* Si la pâte était peu mouillée, le modèle donne un retrait minuscule :
     on ne raconte alors PAS une fissure qui n'existe pas. */
  const fort = retraitTemoin.long >= 1.0;
  /* et VOTRE brique peut se fendre aussi : au-delà de ce seuil de retrait,
     une terre sans assez de fibres pour l'eau qu'elle contient se fissure. */
  const SEUIL_FISSURE = 3.0;                     /* % de retrait longitudinal */
  const vousFendez = retraitVisiteur.long >= SEUIL_FISSURE;
  dire('Même eau, même séchage. Une seule différence : les fibres.');
  dirFaire('À droite, la <b>même pâte sans aucune fibre</b>. Regardez.');

  apres(0.9, () => {
    if (vousFendez){
      /* on rejoue le séchage de VOTRE brique, fissure comprise */
      v.userData.fissure.visible = true;
      tache(2.8, u => { v.userData.fissure.scale.z = Math.max(0.001, Math.pow(u,1.7)); },
        () => { audioDemarre(); sonFissure(); });
    }
    briqueTemoin.visible = true;
    briqueTemoin.position.copy(FIN_D);
    briqueTemoin.material.color.copy(v.material.color);
    briqueTemoin.material.roughness = 0.95;
    briqueTemoin.userData.fissure.visible = fort;
    appliquerRetrait(briqueTemoin, 0, retraitTemoin);
    etiqRG.userData.t = 'VOTRE PÂTE';
    etiqRG.userData.s = f1(formulation.f) + ' % de fibres';
    etiqRD.userData.t = 'TÉMOIN';
    etiqRD.userData.s = 'sans fibres';
    etiqRG.userData.redraw(); etiqRD.userData.redraw();
    etiqRG.visible = etiqRD.visible = true;
    tache(0.4, u => { etiqRG.scale.setScalar(lisse(u)); etiqRD.scale.setScalar(lisse(u)); });
    carte.userData.mode = 'retrait'; carte.userData.redraw();
    if (echelleRetrait === 1) majEchelle(ampli);
    sonCourt(240, 0.20, 'triangle');
    /* le témoin sèche, et se fend */
    tache(2.8, u => {
      appliquerRetrait(briqueTemoin, u, retraitTemoin);
      briqueTemoin.userData.fissure.scale.z = Math.max(0.001, Math.pow(u,1.7));
    }, () => {
      if (fort) { audioDemarre(); sonFissure(); }
      if (vousFendez){
        dire('Votre brique s’est fendue elle aussi : trop d’eau pour si peu de fibres.');
        dirFaire('<b>Moins d’eau, ou plus de fibres</b> — c’est tout l’arbitrage.');
      } else if (fort){
        dire('Sans fibres, le retrait est bien plus fort — et la brique se fend.');
        dirFaire('Le bouton <b>Échelle réelle</b> remet les vrais millimètres.');
      } else {
        dire('Votre pâte était peu mouillée : presque pas de retrait, avec ou sans fibres.');
        dirFaire('<b>Plus d’eau à mélanger, plus de retrait.</b> C’est l’eau qui commande.');
      }
      apres(6.5, () => {
        dire(fort ? 'C’est pour ça qu’on met de la paille dans la terre. Depuis toujours.'
                  : 'Moins d’eau au malaxage, moins de retrait : la première règle de la terre.');
        dirFaire('Et maintenant&nbsp;? <b>On monte le mur.</b>');
        apres(3.5, () => {
          S('retrait').hidden = true;
          etiqRG.visible = etiqRD.visible = false;
          if (typeof ouvrirActe4 === 'function') ouvrirActe4();
        });
      });
    });
  });
}

/* ============================================================================
   ACTE 4 — LE MUR SE MONTE DEVANT VOUS
   Le visiteur ne se déplace jamais : on l'emmène par un fondu au noir, il
   reste assis ou debout, et c'est le mur qui vient à lui, brique après brique.
   (Recommandation de confort Meta pour la VR : pas de locomotion artificielle,
   transitions en fondu.)
   ============================================================================ */
const ZC = -60;                                  /* le chantier, loin de la cuisine */
const gChantier = new THREE.Group(); gChantier.position.set(0,0,ZC);
gChantier.visible = false; scene.add(gChantier);

const mTerreBrique = materiau({ base:[150,96,62], mottle:0.30, grain:0.12, micro:0.05,

const mEnduit = materiau({ base:[186,150,112], mottle:0.14, grain:0.07, micro:0.03,

const mTuile = materiau({ base:[132,68,48], mottle:0.22, grain:0.10, micro:0.04,

/* le sol et le ciel du chantier */
{

const cielFond = new THREE.Color(0x9EC6E4);

/* quelques arbres au loin : le ciel nu sonnait faux */
{
  const tronc = new THREE.MeshStandardMaterial({color:0x5E4632, roughness:0.95});
  const feuille = new THREE.MeshStandardMaterial({color:0x4E6B3C, roughness:0.98});
  let g = 1234;
  const rnd = () => (g = (g*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i=0; i<22; i++){
    const a = rnd()*Math.PI*2, d = 11 + rnd()*16;
    const x = Math.sin(a)*d, z = -1.8 + Math.cos(a)*d;
    if (Math.abs(x) < 3.2 && z > -7) continue;
    const h = 2.4 + rnd()*2.6;
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.15,h*0.42,7), tronc);
    t.position.set(x, h*0.21, z); gChantier.add(t);
    const f = new THREE.Mesh(new THREE.SphereGeometry(h*0.30,9,7), feuille);
    f.position.set(x, h*0.58, z); f.scale.y = 1.25; gChantier.add(f);
  }
}

/* --- le mur, brique par brique --- */
const BL = 0.290, BH = 0.092, BE = 0.140, JOINT = 0.012;
const MOD  = BL + JOINT;                          /* le module de l'appareil */
const DEMI = (BL - JOINT) / 2;                    /* la brique d'about, dite « demi » */
const RANGS = 19, PARRANG = 8, SOUBA = 0.24;
const LONG = PARRANG*MOD - JOINT;                 /* ≈ 2,40 m */
const HRANG = BH + JOINT;
const briques = [];
const geoBrique = new THREE.BoxGeometry(BL,BH,BE);
const geoDemi   = new THREE.BoxGeometry(DEMI,BH,BE);
const mMortier  = new THREE.MeshStandardMaterial({ color:0x9E9484, roughness:0.97 });
{
  /* le soubassement : une brique de terre ne touche jamais le sol, c'est la règle */
  const sb = box(LONG+0.16, SOUBA, BE+0.14,
    new THREE.MeshStandardMaterial({color:0x6E6A62, roughness:0.95}), 0, SOUBA/2, -1.80, gChantier);
  sb.receiveShadow = true;
  gChantier.userData.soubassement = sb;
}
const Y0 = SOUBA + BH/2;
const G = -LONG/2;                                /* nu extérieur gauche du mur */
const xM = m => G + m*MOD;                        /* abscisse d'une borne de module */

/* ----------------------------------------------------------------------------
   L'APPAREIL
   Les baies sont calées sur le module : c'est la condition pour que les
   jambages soient d'aplomb et qu'aucune brique ne se retrouve en porte-à-faux.
   Chaque rang est découpé en trumeaux (les pleins entre les baies) ; un
   trumeau se remplit de briques entières au rang pair, et de deux briques
   d'about encadrant des entières au rang impair. Aucun choix n'est laissé
   au hasard : c'est l'appareil à joints croisés, tel qu'on le monte.
   ---------------------------------------------------------------------------- */
const BAIES = [
  { nom:'porte',   m0:1, m1:3, r0: 0, r1:15 },
  { nom:'fenetre', m0:5, m1:7, r0: 8, r1:13 }
];
for (const b of BAIES){ b.x0 = xM(b.m0) - JOINT; b.x1 = xM(b.m1) - JOINT; }
const baieDe = n => BAIES.find(b => b.nom === n);
const basBaie  = b => Y0 + b.r0*HRANG - BH/2 - JOINT;
const hautBaie = b => Y0 + b.r1*HRANG + BH/2 + JOINT;

/* les trumeaux d'un rang, en modules */
function trumeaux(r){
  const trous = BAIES.filter(b => r >= b.r0 && r <= b.r1)
                     .map(b => [b.m0, b.m1]).sort((u,v) => u[0]-v[0]);
  const out = []; let a = 0;
  for (const [t0,t1] of trous){ if (t0 > a) out.push([a,t0]); a = Math.max(a,t1); }
  if (a < PARRANG) out.push([a, PARRANG]);
  return out;
}

let semence = 20260926;
const alea = () => (semence = (semence*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

function poseBrique(geo, x, y){
  const m = new THREE.Mesh(geo, mTerreBrique.clone());
  m.castShadow = m.receiveShadow = true;
  /* aucune brique de terre n'a exactement la teinte de sa voisine */
  m.userData.nuance = [ (alea()-0.5)*0.014, (alea()-0.5)*0.10, (alea()-0.5)*0.075 ];
  m.material.color.offsetHSL(...m.userData.nuance);
  m.userData.cible = new THREE.Vector3(x, y, -1.80 + (alea()-0.5)*0.008);
  m.visible = false; gChantier.add(m); briques.push(m);
  return m;
}

/* le mortier : un fond plein derrière chaque trumeau, pour qu'on ne voie pas
   le paysage à travers les joints */
const revelations = [];   /* tout ce qui apparaît quand le mur atteint sa hauteur */
const mortiers = [];      /* les fonds de mortier, fusionnés une fois le mur fermé */
for (let r=0; r<RANGS; r++){
  const y = Y0 + r*HRANG;
  const pair = (r % 2 === 0);
  for (const [a,b] of trumeaux(r)){
    const larg = (b-a)*MOD - JOINT;
    const f = box(larg + 0.006, HRANG + 0.004, BE - 0.032, mMortier,
                  (xM(a) + xM(b) - JOINT)/2, y, -1.806, gChantier);
    f.castShadow = false; f.visible = false; f.userData.th = 'mur'; mortiers.push(f);
    revelations.push({ y: y - 0.02, objets:[f] });

    if (pair){
      for (let m=a; m<b; m++) poseBrique(geoBrique, xM(m) + BL/2, y);
    } else {
      poseBrique(geoDemi, xM(a) + DEMI/2, y);
      for (let k=0; k<b-a-1; k++)
        poseBrique(geoBrique, xM(a) + DEMI + JOINT + k*MOD + BL/2, y);
      if (b-a >= 1) poseBrique(geoDemi, xM(b) - JOINT - DEMI/2, y);
    }
  }
}
/* un rang d'about en couronnement : le mur ne se termine pas dans le vide */
{
  const cour = box(LONG + 0.10, 0.055, BE + 0.06, mMortier, 0, Y0 + RANGS*HRANG - BH/2 + 0.028, -1.80, gChantier);
  cour.visible = false; cour.userData.th = 'mur';
  revelations.push({ y: 99, objets:[cour] });   /* posé quand la dernière brique est en place */
}

/* ------------------------------------------------------------------
   LES MENUISERIES — elles apparaissent au fur et à mesure que le mur
   les atteint : d'abord le seuil et l'appui, puis les linteaux, puis
   le dormant, le vitrage, la porte et ses ferrures.
   ------------------------------------------------------------------ */
const mChene  = materiau({ base:[112,76,44], planches:true, mottle:0.22, grain:0.16, micro:0.05,
                           roughBase:0.52, roughVar:0.16, relief:7, scale:9, seed:33,
                           repeat:[1,2], normalScale:0.65 });
const mVolet  = materiau({ base:[86,104,96], planches:true, mottle:0.16, grain:0.12, micro:0.04,
                           roughBase:0.60, roughVar:0.14, relief:6, scale:8, seed:41,
                           repeat:[1,2], normalScale:0.55 });
const mVitrage = new THREE.MeshPhysicalMaterial({ color:0xD6E8F2, roughness:0.05, metalness:0,
                   transparent:true, opacity:0.26, ior:1.52, envMapIntensity:2.4,
                   clearcoat:1, clearcoatRoughness:0.03, side:THREE.DoubleSide });
const mPierre = new THREE.MeshStandardMaterial({ color:0x8E897E, roughness:0.92 });

function poseTardive(y, ...objets){
  for (const o of objets) o.visible = false;
  revelations.push({ y, objets });
}

/* --- la fenêtre : dormant, meneau, deux vantaux vitrés, appui, volets --- */
{
  const b = baieDe('fenetre');
  const yB = basBaie(b), yH = hautBaie(b);
  const cx = (b.x0 + b.x1)/2, L = b.x1 - b.x0, H = yH - yB;
  const EP = 0.055, Z = -1.80;

  const appui = box(L+0.16, 0.055, BE+0.10, mPierre, cx, yB-0.028, Z+0.016, gChantier);
  const lint  = box(L+0.20, 0.105, BE+0.03, mChene,  cx, yH+0.052, Z, gChantier);
  /* dormant */
  const dg = box(EP, H, 0.075, mChene, b.x0+EP/2, (yB+yH)/2, Z, gChantier);
  const dd = box(EP, H, 0.075, mChene, b.x1-EP/2, (yB+yH)/2, Z, gChantier);
  const dh = box(L, EP, 0.075, mChene, cx, yH-EP/2, Z, gChantier);
  const db = box(L, EP, 0.075, mChene, cx, yB+EP/2, Z, gChantier);
  const meneau = box(0.042, H-2*EP, 0.075, mChene, cx, (yB+yH)/2, Z, gChantier);
  /* les deux vantaux */
  const lv = (L - 2*EP - 0.042)/2;
  const vitres = [];
  for (const c of [-1, 1]){
    const v = box(lv, H-2*EP-0.01, 0.010, mVitrage, cx + c*(0.021 + lv/2), (yB+yH)/2, Z+0.004, gChantier);
    v.castShadow = false; vitres.push(v);
    /* petit bois horizontal */
    box(lv, 0.024, 0.030, mChene, cx + c*(0.021 + lv/2), (yB+yH)/2, Z, gChantier);
  }
  /* volets rabattus CONTRE le mur, pas dedans : à Z+0,058 ils traversaient le
     parement, et une brique sur deux laissait voir le volet (z-fighting) */
  const vg = box(0.30, H-0.02, 0.028, mVolet, b.x0-0.155, (yB+yH)/2, Z+BE/2+0.020, gChantier);
  const vd = box(0.30, H-0.02, 0.028, mVolet, b.x1+0.155, (yB+yH)/2, Z+BE/2+0.020, gChantier);
  poseTardive(yB, appui, db);
  poseTardive(yH, lint, dg, dd, dh, meneau, vg, vd, ...vitres);
  gChantier.userData.fenetre = { cx, cy:(yB+yH)/2, L, H, yB, yH, vitres,
    chauds:[dg,dd,dh,db,meneau,...vitres], froids:[appui,vg,vd] };
}

/* --- la porte : seuil, dormant, vantail à planches, ferrures --- */
{
  const b = baieDe('porte');
  const yB = basBaie(b), yH = hautBaie(b);
  const cx = (b.x0 + b.x1)/2, L = b.x1 - b.x0, H = yH - yB;
  const EP = 0.055, Z = -1.80;

  const seuil = box(L+0.22, 0.055, BE+0.16, mPierre, cx, SOUBA+0.012, Z+0.024, gChantier);
  const lint  = box(L+0.22, 0.115, BE+0.03, mChene,  cx, yH+0.057, Z, gChantier);
  const dg = box(EP, H, 0.080, mChene, b.x0+EP/2, (yB+yH)/2, Z, gChantier);
  const dd = box(EP, H, 0.080, mChene, b.x1-EP/2, (yB+yH)/2, Z, gChantier);
  const dh = box(L, EP, 0.080, mChene, cx, yH-EP/2, Z, gChantier);
  /* le vantail, monté sur un pivot pour pouvoir s'entrouvrir */
  const pivot = new THREE.Group();
  pivot.position.set(b.x0+EP, 0.285, Z+0.030); gChantier.add(pivot);
  const lv = L - 2*EP, hv = yH - EP - 0.285;
  const vantail = box(lv, hv, 0.042, mChene, lv/2, hv/2, 0, pivot);
  /* planches verticales et deux barres */
  const planches = [];
  for (let i=0;i<5;i++) planches.push(box(lv/5-0.010, hv-0.03, 0.012, mChene, (i+0.5)*lv/5, hv/2, 0.026, pivot));
  const b1 = box(lv-0.03, 0.045, 0.014, mChene, lv/2, hv*0.24, 0.030, pivot);
  const b2 = box(lv-0.03, 0.045, 0.014, mChene, lv/2, hv*0.76, 0.030, pivot);
  const poignee = new THREE.Mesh(new THREE.TorusGeometry(0.038,0.008,8,18), mLaiton);
  poignee.position.set(lv-0.085, hv*0.50, 0.040); pivot.add(poignee);
  const gonds = [];
  for (const yy of [hv*0.22, hv*0.78]) gonds.push(box(0.10,0.030,0.020, mLaiton, 0.05, yy, 0.036, pivot));
  poseTardive(SOUBA+0.10, seuil);
  poseTardive(yH, lint, dg, dd, dh);
  poseTardive(yH, vantail, ...planches, b1, b2, poignee, ...gonds);
  gChantier.userData.porte = { pivot, cx, yB, yH, L, H,
    chauds:[vantail,...planches,b1,b2,poignee,...gonds,dg,dd,dh], froids:[seuil] };
}

/* le tas de briques d'où elles partent */
const TAS = new THREE.Vector3(-1.35, 0.20, -0.95);

/* ----------------------------------------------------------------------------
   LA BRIQUE DE CLEF
   Trente secondes de spectacle, c'est long en VR. On en garde une : la
   dernière, en haut au milieu. Le visiteur la pose lui-même, et le mur
   devient le sien. Si personne ne bouge, elle se pose toute seule au bout de
   quinze secondes — un stand ne doit jamais rester bloqué.
   ---------------------------------------------------------------------------- */
let briqueClef = null;
{
  /* La dernière brique ferme le DERNIER RANG, au milieu : c'est là qu'un
     maçon pose la dernière, pas au milieu d'un mur déjà monté. */
  const VISE = new THREE.Vector2(0, Y0 + (RANGS-1)*HRANG);
  let d2 = Infinity;
  for (const b of briques){
    const c = b.userData.cible;
    if (Math.abs(c.y - VISE.y) > 0.01) continue;      /* le dernier rang, et lui seul */
    const d = (c.x - VISE.x)*(c.x - VISE.x);
    if (d < d2){ d2 = d; briqueClef = b; }
  }
  if (briqueClef) briqueClef.userData.clef = true;
}
/* son emplacement, dessiné en creux */
const empreinteClef = new THREE.LineSegments(
  new THREE.EdgesGeometry(briqueClef ? briqueClef.geometry : geoBrique),
  new THREE.LineBasicMaterial({color:0xF2C185, transparent:true, opacity:0.9}));
empreinteClef.visible = false; gChantier.add(empreinteClef);
if (briqueClef) empreinteClef.position.copy(briqueClef.userData.cible);
/* un halo dans le trou, sinon on ne voit pas où elle va */
const haloClef = new THREE.Mesh(new THREE.PlaneGeometry(BL*0.96, BH*0.96),
  new THREE.MeshBasicMaterial({color:0xF2C185, transparent:true, opacity:0.0,
                               toneMapped:false, depthWrite:false}));
haloClef.visible = false; gChantier.add(haloClef);
if (briqueClef) haloClef.position.copy(briqueClef.userData.cible).setZ(briqueClef.userData.cible.z + BE/2 + 0.004);

/* la plaque « posez-la » */
const plaqueClef = fiche(0.44, 0.135, {}, (g,W,H)=>{
  g.fillStyle='rgba(20,15,12,.90)'; rr(g,0,0,W,H,10); g.fill();
  g.strokeStyle='#F2C185'; g.lineWidth=3; rr(g,4,4,W-8,H-8,8); g.stroke();
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#F8F3E8'; g.font='bold 21px Georgia, serif';
  g.fillText('IL EN MANQUE UNE', W/2, H*0.36);
  g.fillStyle='#F2C185'; g.font='bold 15px Segoe UI, sans-serif';
  g.fillText('touchez-la pour la poser', W/2, H*0.72);
}, 500);
plaqueClef.visible = false; gChantier.add(plaqueClef);
const zoneClef = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.30,0.30),
  new THREE.MeshBasicMaterial({visible:false}));
zoneClef.visible = false; gChantier.add(zoneClef);

/* ---- LE CORDEAU : le fil tendu qui donne le niveau du rang ---- */
const cordeau = new THREE.Group(); cordeau.visible = false; gChantier.add(cordeau);
{
  const fil = new THREE.Mesh(new THREE.BoxGeometry(LONG + 0.42, 0.004, 0.004),
    new THREE.MeshBasicMaterial({color:0xF0E6D4}));
  fil.position.set(0, 0, -1.72); cordeau.add(fil);
  for (const c of [-1, 1]){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.22,8), mLaiton);
    p.position.set(c*(LONG/2 + 0.20), -0.07, -1.72); cordeau.add(p);
  }
}
/* ---- LE FIL À PLOMB : il pend, il oscille, il dit que c'est un chantier ---- */
const filPlomb = new THREE.Group(); filPlomb.visible = false; gChantier.add(filPlomb);
{
  const corde = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.62, 0.003),
    new THREE.MeshBasicMaterial({color:0xE8DDC9}));
  corde.position.y = -0.31; filPlomb.add(corde);
  const pl = new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.085, 12), mLaiton);

/* --- la maison qui se referme --- */
const gMaison = new THREE.Group(); gMaison.visible = false; gChantier.add(gMaison);
const PROF = 4.20, HAUT = Y0 + RANGS*HRANG;      /* une vraie pièce, où l'on peut reculer */
/* La sous-face de la toiture s'appuie sur les murs : sa pente part de
   l'arête des pignons (demi-largeur PROF/2 + 0,12 m) et monte jusqu'au faîtage.
   Avant, le versant était posé 33 cm au-dessus du mur : on voyait le vide. */
const PENTE = 0.42, RIDGE = (PROF/2 + 0.12) * Math.tan(PENTE);   /* ≈ 0,99 m de faîtage */
{
  /* les trois autres murs, en enduit de terre : on ne remonte pas 400 briques */
  const mur = (w,h,d,x,y,z,ry)=>{ const m=box(w,h,d,mEnduit,x,y,z,gMaison); m.rotation.y=ry||0; return m; };
  mur(PROF, HAUT, 0.30, -LONG/2+0.15, HAUT/2, -1.80-PROF/2, Math.PI/2);
  mur(PROF, HAUT, 0.30,  LONG/2-0.15, HAUT/2, -1.80-PROF/2, Math.PI/2);
  mur(LONG+0.60, HAUT, 0.30, 0, HAUT/2, -1.80-PROF, 0);

  /* les pignons : sans eux, on verrait le ciel sous la toiture */
  {
    const t = new THREE.Shape();
    t.moveTo(-PROF/2-0.12, 0); t.lineTo(PROF/2+0.12, 0); t.lineTo(0, RIDGE); t.closePath();
    const geo = new THREE.ExtrudeGeometry(t, { depth:0.28, bevelEnabled:false });
    for (const c of [-1, 1]){
      const m = new THREE.Mesh(geo, mEnduit);
      m.rotation.y = Math.PI/2;
      /* l'extrusion part vers +x : on recule de son épaisseur pour que
         chaque pignon tombe pile sur son mur (l'un débordait dehors) */
      m.position.set(c*(LONG/2-0.15) - 0.14, HAUT, -1.80-PROF/2);
      m.castShadow = m.receiveShadow = true; gMaison.add(m);
    }
  }

  /* la toiture, à large débord : c'est elle qui protège la terre de la pluie */
  const pente = new THREE.Group(); pente.position.set(0, HAUT, -1.80-PROF/2); gMaison.add(pente);
  gMaison.userData.pente = pente;
  const dPan = PROF/2 + 0.92;
  const zc = (dPan/2)*Math.cos(PENTE);            /* milieu du versant, en plan */
  const yc = RIDGE - Math.tan(PENTE)*zc + 0.045/Math.cos(PENTE) + 0.004;   /* sous-face sur la pente */
  for (const c of [-1, 1]){
    const p = box(LONG+0.98, 0.09, dPan, mTuile, 0, yc, c*zc, pente);
    p.rotation.x = c*PENTE;
  }
  box(LONG+1.02, 0.09, 0.30, mTuile, 0, RIDGE + 0.085, 0, pente);
  /* cheminée, plantée dans le versant, sortant du faîtage */
  box(0.34, 1.30, 0.34, mEnduit, -LONG*0.26, RIDGE - 0.10, 0.10, pente);
  box(0.44, 0.09, 0.44, mTuile,  -LONG*0.26, RIDGE + 0.60, 0.10, pente);
}

    graverRecette();

function poserSuite(){
  if (murFus) return;               /* le mur a déjà été fusionné (saut d'acte) */
  if (poseIdx >= briques.length) return demanderClef();
  const b = briques[poseIdx++];
  if (b.userData.clef) return poserSuite();          /* celle-là, c'est la sienne */
  const arr = b.userData.cible;
  const dep = TAS.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.3));
  b.position.copy(dep); b.rotation.set(0,(Math.random()-0.5)*0.5,0); b.visible = true;
  /* les premières se posent lentement, on prend le temps de comprendre ; puis ça accélère */
  const av = poseIdx / briques.length;
  /* les premières se posent lentement — on prend le temps de comprendre —
     puis le geste s'enchaîne, comme un maçon qui prend son rythme */
  const duree = 0.085 + 0.50*Math.pow(1 - Math.min(1, av*1.25), 1.6);
  tache(duree, u => {
    const k = lisse(u);
    b.position.lerpVectors(dep, arr, k);
    b.position.y += Math.sin(Math.PI*k)*(0.55 - 0.30*av);
    b.rotation.y *= (1-k);
  }, () => {
    if (murFus){ b.visible = false; return; }
    b.position.copy(arr); b.rotation.set(0,0,0);
    const pm = b.getWorldPosition(new THREE.Vector3());
    sonPose(pm);
    if (poseIdx % 7 === 0) sonTruelle(pm);
    poussiereBrique(arr);
    cordeau.position.y = arr.y + BH/2 + JOINT;
    panneauMur.userData.n = poseIdx; panneauMur.userData.redraw();
    for (const m of revelations){
      if (!m.pose && arr.y > m.y - 0.06){
        m.pose = true;
        for (const o of m.objets) o.visible = true;
        sonCourt(240, 0.10, 'sine');
      }
    }
    poserSuite();
  });
}

function poserClef(auto){

/* petit son mat de pose */
function sonPose(pos){ audioDemarre(); sonImpact(pos, 520 + Math.random()*260); sonCourt(150 + Math.random()*40, 0.07, 'triangle', pos); }
/* le raclement de la truelle sur le mortier */
function sonTruelle(pos){
  if(!AC){ audioDemarre(); if(!AC) return; }
  const s2=source(), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='bandpass'; f.frequency.setValueAtTime(1400, AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(520, AC.currentTime+0.26);
  f.Q.value=1.1;
  g.gain.setValueAtTime(0.0, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.12, AC.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+0.30);
  s2.connect(f); f.connect(g); g.connect(sortieAudio(pos, 0.6));
  s2.start(); s2.stop(AC.currentTime+0.32);
}

  const barre = (x0, x1, y, v, min, max) => {
    g.fillStyle='#3A322A'; rr(g,x0,y,x1-x0,7,4); g.fill();
    g.fillStyle = chaud ? '#C06A2A' : '#6E9A5A';

/* ----------------------------------------------------------------------------
   L'AIR SE VOIT
   Des filets d'air qui montent le long du mur chaud, et des poussières dans
   le rai de lumière. Rien de physique là-dedans : c'est de la mise en scène,
   et elle est annoncée comme telle sur la fiche (bandeau SIMULATION).
   ---------------------------------------------------------------------------- */
const gAir = new THREE.Group(); gAir.visible = false; gDedans.add(gAir);
let filetsAir = null, poussieres = null;
{
  const N = 90;
  const pos = new Float32Array(N*3), base = new Float32Array(N*2), vit = new Float32Array(N);
  let ga2 = 9137; const rn = () => (ga2 = (ga2*1103515245+12345) & 0x7fffffff)/0x7fffffff;
  for (let i=0;i<N;i++){
    base[i*2] = (rn()-0.5)*(LONG-0.2);
    base[i*2+1] = rn();
    vit[i] = 0.16 + rn()*0.24;
    pos[i*3] = base[i*2]; pos[i*3+1] = 0.45 + base[i*2+1]*(HAUT-0.6); pos[i*3+2] = Z_MUR - 0.20;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  filetsAir = new THREE.Points(geo, new THREE.PointsMaterial({
    color:0xFFC98A, size:0.028, transparent:true, opacity:0.0,
    depthWrite:false, toneMapped:false, blending:THREE.AdditiveBlending }));
  filetsAir.userData = { base, vit, N };
  gAir.add(filetsAir);

  /* les poussières du rai de lumière : elles, on les voit tout le temps */
  const M = 70;
  const p2 = new Float32Array(M*3), ph = new Float32Array(M*2);
  for (let i=0;i<M;i++){
    ph[i*2] = rn()*6.28; ph[i*2+1] = 0.3 + rn()*0.7;
    p2[i*3] = (rn()-0.5)*1.6; p2[i*3+1] = 0.8 + rn()*1.1; p2[i*3+2] = Z_MUR - 0.5 - rn()*1.4;
  }
  const geo2 = new THREE.BufferGeometry();
  geo2.setAttribute('position', new THREE.BufferAttribute(p2, 3));
  poussieres = new THREE.Points(geo2, new THREE.PointsMaterial({
    color:0xFFF0D6, size:0.011, transparent:true, opacity:0.30,
    depthWrite:false, toneMapped:false, blending:THREE.AdditiveBlending }));
  poussieres.userData = { ph, M };
  gAir.add(poussieres);
}
function animAir(){
  if (!gAir.visible) return;
  const t = performance.now()/1000;
  const f = filetsAir.geometry.attributes.position.array;
  const { base, vit, N } = filetsAir.userData;
  for (let i=0;i<N;i++){
    let y = (base[i*2+1] + t*vit[i]*0.22) % 1;
    f[i*3+1] = 0.45 + y*(HAUT-0.6);
    f[i*3]   = base[i*2] + Math.sin(t*1.3 + i)*0.035;
  }
  filetsAir.geometry.attributes.position.needsUpdate = true;
  const d = poussieres.geometry.attributes.position.array;
  const { ph, M } = poussieres.userData;
  for (let i=0;i<M;i++){
    d[i*3+1] += Math.sin(t*0.7 + ph[i*2])*0.00035;
    d[i*3]   += Math.cos(t*0.5 + ph[i*2])*0.00030;
  }
  poussieres.geometry.attributes.position.needsUpdate = true;
}

/* ----------------------------------------------------------------------------
   TOUCHER LE MUR
   Même physique qu'à l'acte 6, dans l'autre sens : en été la chaleur entre.
       Tsi = Ti + U · Rsi · (Te − Ti)          Rsi = 0,13 m²·K/W, NF EN ISO 6946
   La valeur est CALCULÉE, pas mesurée, et la plaque le dit.
   ---------------------------------------------------------------------------- */
const zoneMurInt = new THREE.Mesh(new THREE.PlaneGeometry(LONG, HAUT-0.45),

function UmurEte(){
  if (solutionActive === 'conventionnel') return DONNEES.thermique.parois.parpaingNu.U;
  return Umur('terre');

function tempSurfaceInt(){
  const TH2 = DONNEES.thermique;
  const Ti = solutionActive ? DONNEES.solutions[solutionActive].tempInterieure : DONNEES.exterieur.temp;
  const Te = DONNEES.exterieur.temp;
  return Ti + UmurEte() * TH2.Rsi * (Te - Ti);
}

/* --- l'hygromètre, à côté du tableau de bord --- */
const hygro = fiche(0.26, 0.26, {h:0}, (g,W,H,d)=>{
  const cx=W/2, cy=H/2, R=W*0.455;
  g.fillStyle='#F4EFE2'; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
  g.strokeStyle='#8A8276'; g.lineWidth=W*0.030; g.beginPath(); g.arc(cx,cy,R-W*0.016,0,7); g.stroke();
  const A0=Math.PI*0.78, A1=Math.PI*2.22, H0=20, H1=100;
  for (let v=H0; v<=H1; v+=5){
    const a=A0+(A1-A0)*(v-H0)/(H1-H0), gros=(v%20===0);
    g.strokeStyle = gros ? '#2A241C' : '#9A9286'; g.lineWidth = gros ? W*0.014 : W*0.007;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*R*(gros?0.72:0.80), cy+Math.sin(a)*R*(gros?0.72:0.80));
    g.lineTo(cx+Math.cos(a)*R*0.89, cy+Math.sin(a)*R*0.89); g.stroke();
    if (gros){ g.fillStyle='#4A4034'; g.font='bold '+Math.round(W*0.062)+'px Segoe UI, sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(String(v), cx+Math.cos(a)*R*0.60, cy+Math.sin(a)*R*0.60); }
  }
  g.fillStyle='#7A6A55'; g.font=Math.round(W*0.055)+'px Segoe UI, sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText('% HR', cx, cy - R*0.40);
  const a=A0+(A1-A0)*(Math.max(H0,Math.min(H1,d.h))-H0)/(H1-H0);
  g.strokeStyle='#1F5B8A'; g.lineWidth=W*0.024; g.lineCap='round';
  g.beginPath(); g.moveTo(cx-Math.cos(a)*R*0.12, cy-Math.sin(a)*R*0.12);
  g.lineTo(cx+Math.cos(a)*R*0.80, cy+Math.sin(a)*R*0.80); g.stroke();
  g.fillStyle='#2A241C'; g.beginPath(); g.arc(cx,cy,W*0.040,0,7); g.fill();
  g.fillStyle='#403528'; g.font='bold '+Math.round(W*0.085)+'px Segoe UI, sans-serif';
  g.fillText(Math.round(d.h) + ' %', cx, cy + R*0.44);
}, 700);

let solutionActive = null, bascEnCours = false;
